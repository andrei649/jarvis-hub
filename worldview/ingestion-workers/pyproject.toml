# WorldView ingestion workers — Python package config.
# Workers normalize OSINT sources to the canonical envelope and publish to Kafka.

[project]
name = "worldview-ingest"
version = "0.1.0"
description = "WorldView OSINT ingestion workers (ADS-B, AIS, TLE/SGP4, EW/H3)"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.11",
    "httpx>=0.27",
    "pydantic>=2.7",
    "sgp4>=2.23",
    "h3>=4.0",
    "python-dotenv>=1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

    spec:
      containers:
        - name: history-writer
          image: ghcr.io/worldview/backend-api:TODO   # TODO(app): real image tag
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKERS
              value: "redpanda.worldview.svc.cluster.local:29092"
            - name: DATABASE_URL
              value: "postgresql://worldview:worldview@timescaledb.worldview.svc.cluster.local:5432/worldview"

services:
  jarvis-signal-layer:
    build: ./services/signal-layer
    environment:
      JARVIS_WORLDVIEW_MODE: ${JARVIS_WORLDVIEW_MODE:-replay}
      SIGNAL_LAYER_PORT: 8787
      SIGNAL_LAYER_HOST: 0.0.0.0
      WORLDMONITOR_BASE_URL: ${WORLDMONITOR_BASE_URL:-http://worldmonitor:3000}
      WORLDMONITOR_MCP_URL: ${WORLDMONITOR_MCP_URL:-http://worldmonitor:3000/api/mcp}
    ports:
      - "8787:8787"

  # Optional. Keep WorldMonitor external or mount your cloned copy here.
  # worldmonitor:
  #   build: ./external/worldmonitor
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - ./external/worldmonitor/.env

<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JARVIS HUB</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a1a;color:#e0dcd0;min-height:100vh}
  .app{display:flex;height:100vh}
  .sidebar{width:260px;background:#22221f;border-right:1px solid #333;padding:24px;overflow-y:auto;flex-shrink:0}
  .sidebar h1{font-size:18px;font-weight:700;color:#f5e6b8;margin-bottom:20px;letter-spacing:1px}
  .sidebar h1 span{color:#d4a74a}
  .agent-list{display:flex;flex-direction:column;gap:4px}
  .agent-item{padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;transition:background .2s}
  .agent-item:hover{background:#33322e}
  .agent-item.active{background:#3a3528;color:#f5e6b8}
  .agent-status{width:8px;height:8px;border-radius:50%;display:inline-block}
  .status-online{background:#6b8f59}
  .status-idle{background:#d4a74a}
  .status-offline{background:#6b4a4a}
  .main{flex:1;display:flex;flex-direction:column}
  .chat-header{padding:16px 24px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
  .chat-header h2{font-size:16px;font-weight:600}
  .chat-header .model-badge{font-size:11px;background:#33322e;padding:4px 10px;border-radius:12px;color:#b0aca0}
  .messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
  .msg{max-width:70%;padding:14px 18px;border-radius:12px;font-size:14px;line-height:1.6}
  .msg.user{background:#3a3528;align-self:flex-end;border-bottom-right-radius:4px}
  .msg.agent{background:#22221f;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid #333}
  .msg.agent .agent-label{font-size:11px;color:#d4a74a;margin-bottom:6px;font-weight:600}
  .input-area{padding:16px 24px;border-top:1px solid #333;display:flex;gap:12px}
  .input-area input{flex:1;padding:12px 16px;border-radius:8px;border:1px solid #444;background:#22221f;color:#e0dcd0;font-size:14px;outline:none;transition:border .2s}
  .input-area input:focus{border-color:#d4a74a}
  .input-area button{padding:12px 24px;border-radius:8px;border:none;background:#d4a74a;color:#1a1a1a;font-weight:600;cursor:pointer;font-size:14px;transition:background .2s}
  .input-area button:hover{background:#e6b85c}
  .input-area button:disabled{opacity:.5;cursor:not-allowed}
  @media(max-width:768px){.sidebar{display:none}.msg{max-width:90%}}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <h1>JARVIS <span>HUB</span></h1>
    <div class="agent-list" id="agentList"></div>
  </div>
  <div class="main">
    <div class="chat-header">
      <h2 id="currentAgent">Jarvis</h2>
      <span class="model-badge" id="modelBadge">deepseek-r1:32b</span>
    </div>
    <div class="messages" id="messages">
      <div class="msg agent">
        <div class="agent-label">Jarvis</div>
        Bună. Sistemul este operațional. Cu ce pot să te ajut?
      </div>
    </div>
    <div class="input-area">
      <input type="text" id="input" placeholder="Scrie un mesaj sau spune 'Jarvis'..." autofocus>
      <button id="sendBtn">Trimite</button>
    </div>
  </div>
</div>
<script>
let agents = [];
let currentAgent = 'jarvis';

async function loadAgents() {
  try {
    const r = await fetch('/api/agents');
    const d = await r.json();
    agents = d.agents;
    const list = document.getElementById('agentList');
    list.innerHTML = agents.map(a =>
      `<div class="agent-item ${a.id === currentAgent ? 'active' : ''}" data-id="${a.id}" onclick="selectAgent('${a.id}')">
        <span>${a.name}</span>
        <span class="agent-status ${a.enabled ? 'status-online' : 'status-offline'}"></span>
      </div>`
    ).join('');
    updateHeader();
  } catch(e) {}
}

function selectAgent(id) {
  currentAgent = id;
  loadAgents();
  updateHeader();
  document.getElementById('input').focus();
}

function updateHeader() {
  const a = agents.find(x => x.id === currentAgent);
  if(a) {
    document.getElementById('currentAgent').textContent = a.name;
    document.getElementById('modelBadge').textContent = a.model;
  }
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;

  addMessage('user', text);
  addMessage('agent', '...', currentAgent);

  try {
    const r = await fetch('/api/query', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, agent: currentAgent})
    });
    const d = await r.json();
    const msgs = document.querySelectorAll('.messages .msg.agent:last-child');
    const lastMsg = msgs[msgs.length - 1];
    if(lastMsg && lastMsg.textContent.trim() === '...') {
      lastMsg.remove();
    }
    let response = d.response || '(no response)';
    addMessage('agent', response, currentAgent);
  } catch(e) {
    addMessage('agent', 'Eroare de conexiune.');
  }
  btn.disabled = false;
}

function addMessage(role, text, agentName) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if(role === 'agent' && agentName) {
    div.innerHTML = '<div class="agent-label">' + agentName + '</div>' + escapeHtml(text);
  } else {
    div.textContent = text;
  }
  document.getElementById('messages').appendChild(div);
  div.scrollIntoView({behavior:'smooth'});
}

function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

document.getElementById('input').addEventListener('keydown', e => { if(e.key === 'Enter') sendMessage(); });
document.getElementById('sendBtn').addEventListener('click', sendMessage);
loadAgents();
</script>
</body>
</html>

services:

  # The hub runs serve.py — the canonical entry — never raw uvicorn: only serve.py applies
  # a staged in-place restore at boot and re-execs itself when an approved restore asks it
  # to (H010). Same posture as Dockerfile / docker-compose.quickstart.yml: host networking
  # and a loopback bind, so boot_guards.assert_safe_bind passes without a token and nothing
  # is published on a LAN interface (qdrant/neo4j/n8n publish their ports to the host, so
  # .env's localhost URLs reach them). serve.py turns uvicorn's proxy-header layer off
  # itself (H691). Docker Desktop: enable host networking first.
  jarvis:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY requirements-beta.txt .
        RUN pip install --no-cache-dir -r requirements-beta.txt
        COPY . .
        EXPOSE 8080
        CMD ["python", "serve.py"]
    network_mode: host
    # tini as pid 1: the coordinator shares this pid namespace (below), so something here
    # must reap what is orphaned in it; serve.py's self-restart re-exec keeps its own pid.
    init: true
    environment:
      JARVIS_HOST: "127.0.0.1"
      JARVIS_PORT: "8080"
      JARVIS_HOME: /data
    env_file:
      - .env
    volumes:
      - nerva_data:/data
    depends_on:
      - qdrant
      - neo4j
      - n8n
    restart: unless-stopped

  # Headless runtime supervisor — coordinator + heartbeat + night shift, wired
  # for real (see scripts/coordinator.py). Separate container from `jarvis`
  # (the HTTP app) so a stuck/crashed coordinator never takes chat down.
  # runtime_supervisor.py respawns a killed coordinator itself;
  # `restart: unless-stopped` is the second layer if the supervisor dies too.
  #
  # H010: it opens the SAME data root as the hub (nerva_data at /data, JARVIS_HOME), so a
  # restore brings its DBs back too, and it sees the hub's staged restore and gives the
  # root up. The marks both processes read (runtime.pid, hub.lock, the restore journal)
  # hold pids, so it joins the hub's pid namespace (`pid: service:jarvis`) — in a namespace
  # of its own every pid probe would read "nobody there". The cost: when the jarvis
  # container stops, this one is stopped with it and comes back after it.
  runtime-coordinator:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY requirements-beta.txt .
        RUN pip install --no-cache-dir -r requirements-beta.txt
        COPY . .
        CMD ["python", "scripts/runtime_supervisor.py"]
    pid: "service:jarvis"
    environment:
      JARVIS_HOME: /data
    env_file:
      - .env
    volumes:
      - nerva_data:/data
      - runtime_logs:/app/logs
    depends_on:
      - jarvis
      - qdrant
      - neo4j
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: none
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  nerva_data:
  qdrant_data:
  neo4j_data:
  n8n_data:
  runtime_logs:

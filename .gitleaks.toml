# AUD-10 (F36): gitleaks config for the blocking secret-scan gate.
# Extends gitleaks' default ruleset; the allowlist below exempts known false
# positives so the gate fails only on NEW secrets. Keep this tight — prefer
# narrow paths/regexes over broad ones, and re-scan when adding entries:
#   gitleaks dir . --config .gitleaks.toml
title = "jarvis-hub gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Known false positives: test fixtures, doc examples, settings-schema key names"
# Non-source trees: test suites/fixtures and documentation carry example tokens
# (incl. the scanner's own test fixtures and worldview/mcp/test fixtures).
paths = [
  '''(^|/)tests?/''',   # tests/  and  worldview/mcp/test/  and  .claude/**/tests/
  '''(^|/)docs/''',     # documentation examples (e.g. NEO4J_AUTH=... in guides)
]
# settings_db.py declares a settings *schema* — `key="..."` is a field name, not a
# credential (values default to ""). Allowlist the one key the generic rule trips on.
regexes = [
  '''stark_ga4_property_id''',
]

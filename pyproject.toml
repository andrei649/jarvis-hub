# Tooling config for Jarvis Hub.
# This file is intentionally tooling-only — the project is run via
# `requirements-beta.txt`, not as an installable package (see CONTRIBUTING.md).
# It exists so that the "code health" process (lint, format, dead-code) behaves
# identically on a developer machine, in CI, and for AI assistants.
# Run the whole pass locally with:  python scripts/code_health.py

[tool.ruff]
# AUD-10 (F35): lint baseline + per-file-ignores live in ruff-baseline.toml
extend = "ruff-baseline.toml"
target-version = "py312"
line-length = 100
# Keep the analysis scoped to source we own.
extend-exclude = ["repo_export.txt", "docs/internal/design_handoff_jarvis_hub", ".opencode"]

[tool.ruff.lint]
# High-signal rules: real bugs (F), pyflakes/pycodestyle (E,W), import hygiene (I),
# common bug patterns (B), modernization (UP), simplifications (SIM), comprehensions (C4).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
# E402 (import-not-at-top): the codebase deliberately does sys.path / env setup
# before imports in entrypoints. E501 (line-too-long) is left to the formatter.
ignore = ["E402", "E501"]

[tool.ruff.lint.mccabe]
# Functions above this cyclomatic complexity are flagged as refactor candidates
# by the `complexity` step of scripts/code_health.py.
max-complexity = 12

[tool.vulture]
# Dead-code detection. Confidence < 80 is too noisy for a dynamic codebase
# (FastAPI routes, plugin/skill loaders, dynamic dispatch).
min_confidence = 80
paths = ["agents", "skills"]
exclude = ["tests/"]

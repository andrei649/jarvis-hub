# Extensibility rules — a review discipline, stated here so it travels with the roster.
# These were a `rules:` block until 2026-09-07; no code read it, and `promotion_criteria`
# quietly disagreed with the knob that is real (`bench.<id>.threshold`, read by
# `JarvisConfig.get_promotion_rules`). Same defect class as the removed `general:` block
# (Hermes absorption 0.6): config nothing reads teaches readers a control that does not exist.
#   universe: Marvel + Greek/Norse mythology + occasional pop ref (each agent's SOUL.md)
#   single responsibility: one agent, one job — a bench entry that would overlap a live
#     agent is not promoted (see the `bench` notes above)
#   promotion: ≥ 20 monthly uses (`bench.<id>.threshold`), a distinct tone, a dedicated channel
#   demotion: ≤ 5 monthly uses for 2 consecutive months
#   cardinality cap: 18 live agents; exceeding it requires an architecture review first

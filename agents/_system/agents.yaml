# Extensibility rules
rules:
  universe: "Marvel + Greek/Norse mythology + occasional pop ref"
  single_responsibility: true
  promotion_criteria:
    min_monthly_uses: 20
    distinct_tone_required: true
    dedicated_channel_required: true
  demotion_criteria:
    max_monthly_uses: 5
    consecutive_months_below: 2
  cardinality_cap: 18
  exceeding_behaviour: "requires architecture review before exceeding 18"

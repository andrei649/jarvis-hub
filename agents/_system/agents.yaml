# Bench — reserved names, not yet active
bench:
  # howard promoted to active 2026-05-30 (Howard Stark Digital Twin, H5.1) —
  # the active entry lives in the `agents:` block above; no bench duplicate.
  #
  # Retired 2026-08-18 — a reserved name is only worth reserving if it can be
  # promoted without causing confusion:
  #   atlas   — "Atlas" is the reality-model/infrastructure sub-brand in
  #             NERVA_VISION.md §2. A batch-processing agent under the same name
  #             would collide with the brand architecture on every mention.
  #   hermes  — "Hermes" is the upstream project this repo benchmarks itself
  #             against (NERVA_VISION.md §9, ORIZONT 20 mining). Its mandate,
  #             cross-channel routing, is also already Jarvis's `channel-route`,
  #             so promoting it would violate single_responsibility.
  #   aria    — outside the `universe` rule below (neither Marvel nor myth) and a
  #             duplicate of `apollo`: both were the same Jerome music split.
  bruce:
    name: Bruce
    archetype: Data Science
    trigger: "Heavy data analysis >20 queries/week"
    triggers_on: vision        # promotion suggested when Vision query volume crosses threshold
    threshold: 20
    window_days: 30

  wanda:

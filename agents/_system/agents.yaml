# Jarvis v0.1.0 — Agent Registry
# Pure Python orchestration (NOT OpenClaw)
# Each agent maps to a SOUL.md in agents/<id>/

jarvis:
  name: "Jarvis Hub"
  version: "0.5.0-beta"
  architecture: "pure-python-plugin"
  cardinality_cap: 18
  created: 2026-05-11
  updated: 2026-05-27

general:
  timezone: Europe/Bucharest
  wake_words: ["jarvis", "hub"]
  default_tts: kokoro-en-british-male-1
  addressing: sir
  llm_backend: auto  # "auto" = try LM Studio first, fallback Ollama
  llm_endpoints:
    lm_studio: http://localhost:1234
    ollama: http://localhost:11434
  cloud_llm_plugin: on-demand
  cloud_llm_agents: [jarvis, athena, stark, vision, veronica]
  frigga_whatsapp_bridge: local

agents:
  jarvis:
    name: Jarvis
    archetype: Prime Orchestrator
    status: active
    tier: command
    channel: voice
    heartbeat: "12h"
    plugins: [cloud-llm, telegram]

  friday:
    name: Friday
    archetype: Daily Intel
    status: active
    tier: command
    channel: voice
    heartbeat: "6h"
    plugins: [telegram]

  pepper:
    name: Pepper
    archetype: Chief of Staff
    status: active
    tier: command
    channel: voice
    heartbeat: "2h"
    plugins: [google-calendar, gmail, telegram]

  jerome:
    name: Jerome
    archetype: Leisure & Soundtrack
    status: active
    tier: command
    channel: voice
    heartbeat: "no"
    plugins: [spotify]

  athena:
    name: Athena
    archetype: External Strategist
    status: active
    tier: business
    channel: web-dashboard
    heartbeat: "6h"
    llm_policy: cloud
    plugins: [cloud-llm]

  stark:
    name: Stark
    archetype: Biz Intel
    status: active
    tier: business
    channel: telegram
    heartbeat: "4h"
    plugins: [gmail]

  veronica:
    name: Veronica
    archetype: Content Plus Comms

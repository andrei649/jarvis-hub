# Jarvis v0.1.0 — Agent Registry
# Pure Python orchestration (NOT OpenClaw)
# Each agent maps to a SOUL.md in agents/<id>/

jarvis:
  name: "Jarvis Hub"
  version: "0.5.0-beta"
  architecture: "pure-python-plugin"
  cardinality_cap: 18
  created: 2026-05-11
  updated: 2026-05-27

# There is deliberately no `general:` block. One existed until 2026-09-07 (timezone, wake
# words, LLM backend and endpoints, a cloud-LLM plugin mode, a `cloud_llm_agents` allowlist,
# a WhatsApp bridge mode) and no line of code read any of it — `JarvisConfig.general` was
# assigned and never consulted, so every reader, human or agent, was told this file
# controlled things it did not (Hermes absorption 0.6). Where those concepts actually live:
#   - timezone, wake words, LLM backend and endpoints → runtime settings
#     (`agents/core/settings_db.py` DEFAULTS, editable in /admin);
#   - which agents may use a cloud model → `LOCAL_ONLY_AGENTS` / `CLOUD_ONLY_AGENTS` /
#     `CLAUDE_AGENTS` in `agents/core/llm/hybrid_router.py`, then the per-agent `llm_policy`
#     key below; cloud credentials are ANTHROPIC_API_KEY / GEMINI_API_KEY in the environment.
# `tests/test_agents_yaml_dead_config.py` keeps this file free of unread keys.


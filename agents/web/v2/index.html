  <div id="root"></div>
  <script>
    /* T-0.29 — register the v2 service worker (installable HUD + offline shell).
       Served from the ROOT path so its scope covers both "/" (the default HUD)
       and "/v2/*"; a worker served from /v2/ could only ever control /v2/.
       Registration failure is non-fatal by design: the HUD is fully functional
       without a service worker, so a refusal must never block boot. */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw-v2.js', { scope: '/' }).catch(function () {});
      });
    }

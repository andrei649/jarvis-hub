<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Nerva mark — a "neural N": three synapse strokes joined at four node points.
       Palette: void black #030810 · signal blue #00AEEF (docs/BRAND_BOOK.md). -->
  <rect width="32" height="32" rx="6" fill="#030810"/>
  <g stroke="#00AEEF" stroke-width="2.2" stroke-linecap="round" fill="none">
    <line x1="10" y1="23" x2="10" y2="9"/>
    <line x1="10" y1="9" x2="22" y2="23"/>
    <line x1="22" y1="23" x2="22" y2="9"/>
  </g>
  <g fill="#00AEEF">
    <circle cx="10" cy="9" r="2"/>
    <circle cx="10" cy="23" r="2"/>
    <circle cx="22" cy="9" r="2"/>
    <circle cx="22" cy="23" r="2"/>
  </g>
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#00AEEF" stroke-width=".75" opacity=".28"/>
</svg>

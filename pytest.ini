[pytest]
# Async tests use pytest-asyncio in auto mode so `async def test_*`
# functions run without needing an explicit @pytest.mark.asyncio decorator.
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
addopts = -q
# Hard per-test timeout — any test that hangs >30 s is a network/IO leak.
timeout = 30

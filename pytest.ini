[pytest]
# Async tests use pytest-asyncio in auto mode so `async def test_*`
# functions run without needing an explicit @pytest.mark.asyncio decorator.
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
# --timeout: backstop so no single test can ever hang (e.g. on a stray real
# network call). thread method works for sync + async without signals.
addopts = -q --timeout=30 --timeout-method=thread

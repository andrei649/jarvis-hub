[pytest]
# Async tests use pytest-asyncio in auto mode so `async def test_*`
# functions run without needing an explicit @pytest.mark.asyncio decorator.
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
# --timeout: backstop so no single test can ever hang (e.g. on a stray real
# network call). thread method works reliably for both sync + async without
# signal handler issues; addopts ensures it applies to local runs (CI can override
# with --timeout=90 for slower platforms like Windows).
# --allow-hosts (AUD-10/F37, pytest-socket): restrict connect() to loopback so a
# stray *real* network call fails fast (SocketConnectBlockedError) instead of
# hanging to the --timeout backstop. In-process TestClient (ASGI transport) and
# localhost test doubles are unaffected; the whole suite mocks external hosts.
# A test that must reach a non-loopback host opts out with @pytest.mark.enable_socket.
addopts = -q --timeout=30 --timeout-method=thread --allow-hosts=127.0.0.1,::1,localhost

version: 2
updates:
  # Python dependencies (requirements.txt, requirements-beta.txt)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"

  # GitHub Actions versions (checkout, setup-python, gh-release, ...)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # npm lockfiles (SEC-4 / audit F-05): HUD root, HUD v2 frontend, WorldView
  # monorepo, WorldView MCP, and mobile. Grouped weekly like the pip config.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-root:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-frontend:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/worldview"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-worldview:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/worldview/mcp"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-worldview-mcp:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/mobile"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-mobile:
        patterns:
          - "*"

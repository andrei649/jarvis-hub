name: CodeQL (advisory)

on:
  push:
    branches: [main]
    paths:
      - "agents/**/*.py"
      - "scripts/**/*.py"
      - "skills/**/*.py"
      - "serve.py"
      - "requirements*.txt"
      - "requirements*.lock"
      - "pyproject.toml"
      - ".github/codeql/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "agents/**/*.py"
      - "scripts/**/*.py"
      - "skills/**/*.py"
      - "serve.py"
      - "requirements*.txt"
      - "requirements*.lock"
      - "pyproject.toml"
      - ".github/codeql/**"
      - ".github/workflows/codeql.yml"
  schedule:
    # Weekly scan to catch advisories published after the last commit.
    - cron: "27 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Advisory analysis (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4
        with:
          languages: python
          # Suite + paths-ignore (test code excluded) live in the config file.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        id: codeql
        # Code scanning (SARIF upload) needs GitHub Advanced Security, which is
        # org-only — unavailable on this private personal repo, so the upload
        # always errors. Keep the scan running but don't fail CI on it. Re-enable
        # as a gate by removing continue-on-error if the repo goes public/org.
        continue-on-error: true
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4
        with:
          category: "/language:python"

      - name: Record advisory outcome honestly
        if: ${{ always() }}
        env:
          CODEQL_OUTCOME: ${{ steps.codeql.outcome }}
        shell: bash
        run: |
          if [[ "$CODEQL_OUTCOME" == "success" ]]; then
            echo "CodeQL advisory analysis completed successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::CodeQL advisory analysis did not complete (${CODEQL_OUTCOME}). This is not security acceptance; the blocking Semgrep, Bandit and secret-scan checks remain authoritative."
            echo "CodeQL advisory outcome: **${CODEQL_OUTCOME}**. Do not cite this job as a green security gate." >> "$GITHUB_STEP_SUMMARY"
          fi

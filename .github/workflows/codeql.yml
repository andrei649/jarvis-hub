name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    # Weekly scan to catch advisories published after the last commit.
    - cron: "27 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4
        with:
          languages: python
          # Suite + paths-ignore (test code excluded) live in the config file.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        # The repo is public, so code scanning + SARIF upload are available and
        # verified working (the analyze step logs "Analysis upload status is
        # complete."). This job is advisory *by design*: per the 2026-08-29
        # de-gate decision it is NOT a required status check and does NOT run on
        # pull_request — push-to-main + weekly only. Re-adding a PR trigger or a
        # required check is restore patch K (docs/restore/README.md), an owner
        # decision. It is deliberately no longer `continue-on-error`: a broken
        # analysis or a failed upload must go red on main, not be swallowed.
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4
        with:
          category: "/language:python"

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan to catch advisories published after the last commit.
    - cron: "27 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4
        with:
          languages: python
          # Suite + paths-ignore (test code excluded) live in the config file.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        # Code scanning (SARIF upload) needs GitHub Advanced Security, which is
        # org-only — unavailable on this private personal repo, so the upload
        # always errors. Keep the scan running but don't fail CI on it. Re-enable
        # as a gate by removing continue-on-error if the repo goes public/org.
        continue-on-error: true
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4
        with:
          category: "/language:python"

name: Nerva Roadmap Integrity

on:
  pull_request:
    paths:
      - "BACKLOG.md"
      - "STATUS.md"
      - "docs/nerva2/ROADMAP_RECONCILIATION.md"
      - "docs/nerva2/ROADMAP_RECONCILIATION.json"
      - "docs/nerva2/ATLAS_E2_0.md"
      - "docs/nerva2/CONTRACT_REGISTRY.json"
      - "docs/nerva2/CORTEX_E1_0.md"
      - "docs/nerva2/CORTEX_E1_1.md"
      - "docs/nerva2/CORTEX_E1_2.md"
      - "docs/nerva2/DEPENDENCIES.md"
      - "docs/nerva2/E0_COMPLETION.md"
      - "docs/nerva2/E0_COMPLETION.json"
      - "docs/nerva2/E0_FINAL_RECONCILIATION.md"
      - "docs/nerva2/ISSUE_LEDGER_RECONCILIATION.md"
      - "docs/nerva2/E0_REPOSITORY_LEDGER_MIGRATION.md"
      - "docs/nerva2/E0_778_BODY_RECONCILIATION.md"
      - "docs/nerva2/EPISODES_E3_0.md"
      - "docs/nerva2/EPISODE_RETRIEVAL_E3_1.md"
      - "docs/nerva2/EXECUTION_PROVIDER_E8_1A.md"
      - "docs/nerva2/EXECUTION_PROVIDER_E8_1B.md"
      - "docs/nerva2/EXECUTION_PROVIDER_E8_1C_PREFLIGHT.json"
      - "docs/nerva2/EXECUTION_PROVIDER_E8_1C_PREFLIGHT.md"
      - "docs/nerva2/HYBRID_COGNITION_BOUNDARY.md"
      - "docs/nerva2/INNOVATION_LAB_RFC_V1.md"
      - "docs/nerva2/INNOVATION_LAB_V1.schema.json"
      - "docs/nerva2/KNOWLEDGE_GARDEN_V1.json"
      - "docs/nerva2/NERVA_PROGRAM_MANIFEST_V1.json"
      - "docs/nerva2/NERVA_PROGRAM_MANIFEST_V1.md"
      - "docs/nerva2/REFLECTION_E6_0.md"
      - "docs/nerva2/REFLECTION_E6_1.md"
      - "docs/nerva2/RESEARCH_LAB_E9_0.md"
      - "docs/nerva2/RESEARCH_LAB_E9_1.md"
      - "docs/nerva2/RISKS.md"
      - "docs/nerva2/SYNAPSE_E8_0.md"
      - "scripts/check_nerva_roadmap.py"
      - "scripts/check_nerva_e0_completion.py"
      - "scripts/check_nerva_e8_1c_preflight.py"
      - "scripts/check_nerva_innovation_lab.py"
      - "scripts/check_nerva_program_manifest.py"
      - "scripts/reconcile_nerva_repository_ledgers.py"
      - "tests/_nerva_innovation_lab_checks.py"
      - "tests/test_reconcile_nerva_repository_ledgers.py"
      - "tests/test_nerva_e0_completion.py"
      - "tests/test_nerva_e8_1c_preflight.py"
      - "tests/test_nerva_program_manifest.py"
      - "tests/test_pr_auto_merge_policy.py"
      - ".github/workflows/pr-auto-merge.yml"
      - ".github/workflows/nerva-roadmap.yml"
  push:
    branches: [main]
    paths:
      - "BACKLOG.md"
      - "STATUS.md"
      - "docs/nerva2/ROADMAP_RECONCILIATION.md"
      - "docs/nerva2/ROADMAP_RECONCILIATION.json"
      - "docs/nerva2/ATLAS_E2_0.md"
      - "docs/nerva2/CONTRACT_REGISTRY.json"
      - "docs/nerva2/CORTEX_E1_0.md"
      - "docs/nerva2/CORTEX_E1_1.md"
      - "docs/nerva2/CORTEX_E1_2.md"
      - "docs/nerva2/DEPENDENCIES.md"
      - "docs/nerva2/E0_COMPLETION.md"
      - "docs/nerva2/E0_COMPLETION.json"
      - "docs/nerva2/E0_FINAL_RECONCILIATION.md"
      - "docs/nerva2/ISSUE_LEDGER_RECONCILIATION.md"
      - "docs/nerva2/E0_REPOSITORY_LEDGER_MIGRATION.md"
      - "docs/nerva2/E0_778_BODY_RECONCILIATION.md"
      - "docs/nerva2/EPISODES_E3_0.md"
      - "docs/nerva2/EPISODE_RETRIEVAL_E3_1.md"
      - "docs/nerva2/EXECUTION_PROVIDER_E8_1A.md"
      - "docs/nerva2/EXECUTION_PROVIDER_E8_1B.md"
      - "docs/nerva2/EXECUTION_PROVIDER_E8_1C_PREFLIGHT.json"
      - "docs/nerva2/EXECUTION_PROVIDER_E8_1C_PREFLIGHT.md"
      - "docs/nerva2/HYBRID_COGNITION_BOUNDARY.md"
      - "docs/nerva2/INNOVATION_LAB_RFC_V1.md"
      - "docs/nerva2/INNOVATION_LAB_V1.schema.json"
      - "docs/nerva2/KNOWLEDGE_GARDEN_V1.json"
      - "docs/nerva2/NERVA_PROGRAM_MANIFEST_V1.json"
      - "docs/nerva2/NERVA_PROGRAM_MANIFEST_V1.md"
      - "docs/nerva2/REFLECTION_E6_0.md"
      - "docs/nerva2/REFLECTION_E6_1.md"
      - "docs/nerva2/RESEARCH_LAB_E9_0.md"
      - "docs/nerva2/RESEARCH_LAB_E9_1.md"
      - "docs/nerva2/RISKS.md"
      - "docs/nerva2/SYNAPSE_E8_0.md"
      - "scripts/check_nerva_roadmap.py"
      - "scripts/check_nerva_e0_completion.py"
      - "scripts/check_nerva_e8_1c_preflight.py"
      - "scripts/check_nerva_innovation_lab.py"
      - "scripts/check_nerva_program_manifest.py"
      - "scripts/reconcile_nerva_repository_ledgers.py"
      - "tests/_nerva_innovation_lab_checks.py"
      - "tests/test_reconcile_nerva_repository_ledgers.py"
      - "tests/test_nerva_e0_completion.py"
      - "tests/test_nerva_e8_1c_preflight.py"
      - "tests/test_nerva_program_manifest.py"
      - "tests/test_pr_auto_merge_policy.py"
      - ".github/workflows/pr-auto-merge.yml"
      - ".github/workflows/nerva-roadmap.yml"
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Exact lowercase 40-hex accepted baseline commit
        required: true
        type: string
      candidate_ref:
        description: Exact lowercase 40-hex candidate commit that must equal HEAD
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NERVA_BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.baseline_ref }}
      NERVA_CANDIDATE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.event.after || inputs.candidate_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.NERVA_CANDIDATE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate syntax
        run: >-
          python -m py_compile
          scripts/check_nerva_roadmap.py
          scripts/check_nerva_e0_completion.py
          scripts/check_nerva_e8_1c_preflight.py
          scripts/check_nerva_innovation_lab.py
          scripts/check_nerva_program_manifest.py
          scripts/check_nerva_issue_movement.py
          scripts/reconcile_nerva_repository_ledgers.py
          tests/_nerva_innovation_lab_checks.py
          tests/test_nerva_e8_1c_preflight.py
          tests/test_nerva_program_manifest.py
          tests/test_nerva_issue_movement.py

      - name: Validate Nerva roadmap reconciliation
        run: python scripts/check_nerva_roadmap.py

      - name: Validate Nerva whole-program manifest
        run: >-
          python scripts/check_nerva_program_manifest.py
          --check
          --candidate-ref "${NERVA_CANDIDATE_REF}"

      - name: Validate exact repository ledger blocks
        run: python scripts/reconcile_nerva_repository_ledgers.py --check

      - name: Validate Nerva E0 completion ledger
        run: python scripts/check_nerva_e0_completion.py

      - name: Validate Nerva E8.1c Hermes static preflight
        run: python scripts/check_nerva_e8_1c_preflight.py --check

      - name: Validate Nerva Innovation Lab immutable refs
        run: >-
          python scripts/check_nerva_innovation_lab.py
          --baseline-ref "${NERVA_BASELINE_REF}"
          --candidate-ref "${NERVA_CANDIDATE_REF}"

      - name: Exercise Nerva Innovation Lab hostile matrix
        run: python tests/_nerva_innovation_lab_checks.py

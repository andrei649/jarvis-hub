name: Nerva Roadmap Integrity

on:
  pull_request:
    paths:
      - "docs/nerva2/ROADMAP_RECONCILIATION.md"
      - "docs/nerva2/ROADMAP_RECONCILIATION.json"
      - "scripts/check_nerva_roadmap.py"
      - ".github/workflows/nerva-roadmap.yml"
  push:
    branches: [main]
    paths:
      - "docs/nerva2/ROADMAP_RECONCILIATION.md"
      - "docs/nerva2/ROADMAP_RECONCILIATION.json"
      - "scripts/check_nerva_roadmap.py"
      - ".github/workflows/nerva-roadmap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate syntax
        run: python -m py_compile scripts/check_nerva_roadmap.py

      - name: Validate Nerva roadmap reconciliation
        run: python scripts/check_nerva_roadmap.py

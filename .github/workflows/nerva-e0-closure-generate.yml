name: Generate Nerva E0 closure ledgers

on:
  push:
    branches:
      - nerva2/e0-closure-state-transition
    paths:
      - ".github/workflows/nerva-e0-closure-generate.yml"

permissions:
  contents: write

concurrency:
  group: nerva-e0-closure-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: nerva2/e0-closure-state-transition
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-beta.lock
            requirements-dev.lock

      - name: Install locked dependencies
        run: |
          pip install --require-hashes -r requirements-beta.lock
          pip install --require-hashes -r requirements-dev.lock

      - name: Transition roadmap manifest to post-E0 dependencies
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/nerva2/ROADMAP_RECONCILIATION.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["snapshot_commit"] = "0c7f880dea1fe254d590ce8967e45cfe453dc52f"
          data["status"] = "done"

          blockers = {
              "E1": [],
              "E2": [],
              "E3": [781],
              "E8": [],
              "E9": [],
          }
          for item in data["first_executable_slices"]:
              item["blocked_by"] = blockers[item["epic"]]

          data["remaining_e0_work"] = []
          data["post_e0_work"] = [
              "Add the whole-program manifest, cycle/orphan detection and generated dependency view.",
              "Map Continuity Core #731 into E2/E3/E4/E5/E6/E10/E11 without duplicate substrate.",
              "Implement #780, #781, #783 and #784 as separate bounded slices; #782 remains after #781.",
              "Earn live task-level Ultron mediation, real adapter, owner-hardware and release evidence in later gates."
          ]
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Apply exact E0 DONE ledger blocks
        run: python scripts/reconcile_nerva_repository_ledgers.py --write

      - name: Refresh generated project status
        env:
          JARVIS_LATEST_CI_COMMIT: 0c7f880dea1fe254d590ce8967e45cfe453dc52f
        run: python scripts/status_sync.py --reuse-js-counts

      - name: Verify closure state
        run: |
          python scripts/reconcile_nerva_repository_ledgers.py --check
          python scripts/check_nerva_roadmap.py
          python scripts/check_nerva_e0_completion.py
          python scripts/status_sync.py --check --reuse-js-counts
          python -m pytest tests/test_reconcile_nerva_repository_ledgers.py tests/test_nerva_e0_completion.py -q
          git diff --check

      - name: Enforce generated-file allowlist
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          allowed = {
              "BACKLOG.md",
              "STATUS.md",
              "docs/nerva2/ROADMAP_RECONCILIATION.json",
              "project-status.json",
              "README.md",
              "NERVA.md",
              "GO_LIVE_PLAN.md",
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines()
              if line.strip()
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"unexpected generated files: {unexpected}")
          required = {
              "BACKLOG.md",
              "STATUS.md",
              "docs/nerva2/ROADMAP_RECONCILIATION.json",
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(f"required closure files did not change: {missing}")
          print("generated allowlist accepted:", sorted(changed))
          PY

      - name: Commit generated closure state and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/nerva-e0-closure-generate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            BACKLOG.md \
            STATUS.md \
            docs/nerva2/ROADMAP_RECONCILIATION.json \
            project-status.json \
            README.md \
            NERVA.md \
            GO_LIVE_PLAN.md \
            .github/workflows/nerva-e0-closure-generate.yml
          git commit -m "docs(nerva2): apply generated E0 closure state"
          git push origin HEAD:nerva2/e0-closure-state-transition

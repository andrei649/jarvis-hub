name: Smoke Test

# Boots the real server on Windows. The pytest suite is covered by ci.yml,
# so this workflow only verifies the app actually starts and serves a request.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-boot:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-beta.lock

      - name: Install dependencies
        # AUD-10 (F33): hash-pinned install — --require-hashes aborts on any sha
        # mismatch. Regenerate with ./scripts/lock_deps.sh (lockfile.yml guards drift).
        run: pip install --require-hashes -r requirements-beta.lock

      - name: Verify server starts
        run: |
          Start-Process -NoNewWindow python -ArgumentList "-m", "uvicorn", "agents.web:app", "--host", "127.0.0.1", "--port", "8080"
          # Poll until the server binds and serves 200. The cold start (17 agents +
          # plugins + orchestrator wiring) routinely takes longer than the old fixed
          # 5s on Windows runners, so a single probe raced the bind and failed with
          # "connection actively refused". Retry every 2s for up to ~60s instead.
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8080/" -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) { $ok = $true; break }
            } catch {
              # server not listening yet — keep polling
            }
          }
          if (-not $ok) { throw "Server did not become ready on http://127.0.0.1:8080/ within 60s" }
          Write-Output "Server smoke test passed"

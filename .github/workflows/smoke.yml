name: Smoke Test

# Boots the real server on Windows. The pytest suite is covered by ci.yml,
# so this workflow only verifies the app actually starts and serves a request.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server-boot:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-beta.txt

      - name: Install dependencies
        run: pip install -r requirements-beta.txt

      - name: Verify server starts
        run: |
          Start-Process -NoNewWindow python -ArgumentList "-m", "uvicorn", "agents.web:app", "--host", "127.0.0.1", "--port", "8080"
          Start-Sleep -Seconds 5
          $response = Invoke-WebRequest -Uri "http://127.0.0.1:8080/" -UseBasicParsing -TimeoutSec 10
          if ($response.StatusCode -ne 200) { throw "Server did not return 200" }
          Write-Output "Server smoke test passed"

name: Smoke Test

on:
  push:
    branches: [master, main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-beta.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -q --no-header

      - name: Verify server starts
        run: |
          Start-Process -NoNewWindow python -ArgumentList "-m", "uvicorn", "agents.web:app", "--host", "127.0.0.1", "--port", "8080"
          Start-Sleep -Seconds 5
          $response = Invoke-WebRequest -Uri "http://127.0.0.1:8080/" -UseBasicParsing -TimeoutSec 10
          if ($response.StatusCode -ne 200) { throw "Server did not return 200" }
          Write-Output "Server smoke test passed"

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full matrix (ubuntu + windows) on every PR and push — Windows is a
        # first-class target (Jarvis runs on Windows), so `test (windows-latest)`
        # is a required check on PRs, not just post-merge.
        os: ["ubuntu-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-beta.txt
      - run: pip install -r requirements-beta.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (non-blocking)
        # Rules/config come from pyproject.toml. Kept quiet here (--exit-zero):
        # the full lint/dead-code/complexity digest is published by
        # code-health.yml so this step doesn't double-report. Drop --exit-zero
        # (and continue-on-error) later to make linting a required gate.
        run: ruff check . --exit-zero
        continue-on-error: true
      - name: Test
        # -n auto: parallelize across runner cores (Windows full-suite goes from
        # ~15min to a few). --dist loadfile keeps each test file on one worker, and
        # conftest gives each worker an isolated JARVIS_HOME so file stores don't race.
        run: python -m pytest tests/ -n auto --dist loadfile --timeout=90 -q --tb=short
        env:
          JARVIS_TESTING: "1"

  frontend:
    # HUD (React-via-globals) unit tests. Runs the real shipped static
    # artifacts inside JSDOM — see tests/frontend/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Runs the suite instrumented, reports coverage, and fails if line
      # coverage regresses below the BUG-2 target (60%).
      - run: npm run test:coverage

  hud-v2-build:
    # Build the v2 HUD (Vite + React + TS) and verify the committed bundle is
    # current — so agents/web/v2 (served at /v2) can't silently go stale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Test (vitest)
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Committed bundle is up to date
        run: |
          git diff --exit-code -- agents/web/v2 \
            || { echo "::error::agents/web/v2 is stale — run 'cd frontend && npm run build' and commit."; exit 1; }

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full matrix on pushes to main; PRs run the cheaper ubuntu-only leg.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-beta.txt
      - run: pip install -r requirements-beta.txt
      - run: pip install ruff pytest-timeout
      - name: Lint (non-blocking)
        # Reports issues with a red X but does not block the run.
        # Drop `continue-on-error` to make linting required.
        run: ruff check .
        continue-on-error: true
      - name: Test
        run: python -m pytest tests/ --timeout=90 -q --tb=short
        env:
          JARVIS_TESTING: "1"

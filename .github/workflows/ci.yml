name: CI

# Development-speed posture (2026-08-29, owner decision): pull requests run ONE
# fast advisory lane — ruff + the pytest suite on ubuntu (~3 min). Everything
# heavier (Windows matrix, sandbox containment, Signal Layer smoke, HUD suites,
# OpenAPI typegen drift) runs post-merge on push to main, so it still catches
# regressions without ever blocking a merge.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Cancel superseded runs for the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PRs: ubuntu only (fast feedback). Post-merge pushes to main add the
        # Windows lane — Jarvis runs on Windows, so the coverage stays, it just
        # no longer sits on the PR critical path (~20 min per run).
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-beta.lock
      # Install from the hash-pinned locks (regenerate with ./scripts/lock_deps.sh).
      - run: pip install --require-hashes -r requirements-beta.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Lint (ruff)
        run: ruff check .
      - name: Test
        # -n auto: parallelize across runner cores. --dist loadfile keeps each
        # test file on one worker, and conftest gives each worker an isolated
        # JARVIS_HOME so file stores don't race.
        run: python -m pytest tests/ -n auto --dist loadfile --timeout=90 -q --tb=short
        env:
          JARVIS_TESTING: "1"

  sandbox-isolation:
    # Post-merge only. Proves the Docker sandbox actually CONTAINS code — no
    # network and a read-only filesystem (RUN_SANDBOX_ISOLATION=1 exercises the
    # real containment test instead of letting it skip).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-beta.lock
      - run: pip install --require-hashes -r requirements-beta.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Pre-pull sandbox image
        run: docker pull python:3.12-slim
      - name: Resolve acquisition sandbox digest
        shell: bash
        run: |
          echo "JARVIS_ACQUISITION_SANDBOX_IMAGE=$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - name: Sandbox containment tests
        run: >-
          python -m pytest
          tests/test_sandbox_isolation.py
          tests/test_h32_acquisition_sandbox_isolation.py
          tests/test_h32_acquisition_reality.py
          -v --timeout=300
        env:
          RUN_SANDBOX_ISOLATION: "1"
          JARVIS_TESTING: "1"

  signal-layer-smoke:
    # Post-merge only. Proves the provider-neutral Signal Layer can run its
    # deterministic replay path without WorldMonitor, Docker, API keys, or
    # network access.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: Smoke test Signal Layer replay mode
        run: npm test
        working-directory: services/signal-layer

  frontend:
    # Post-merge only. HUD (React-via-globals) unit tests — runs the real
    # shipped static artifacts inside JSDOM; see tests/frontend/README.md.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Runs the suite instrumented, reports coverage, and fails if line
      # coverage regresses below the BUG-2 target (60%).
      - run: npm run test:coverage

  hud-v2-build:
    # Post-merge only. Build the v2 HUD (Vite + React + TS) and verify the
    # committed bundle is current — so agents/web/v2 (served at /v2) can't
    # silently go stale.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Test (vitest)
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Committed bundle is up to date
        run: |
          git diff --exit-code -- agents/web/v2 \
            || { echo "::error::agents/web/v2 is stale — run 'cd frontend && npm run build' and commit."; exit 1; }

  openapi-types:
    # Post-merge only. Generated TypeScript must match the live FastAPI OpenAPI
    # schema; boots the backend plus the frontend toolchain and reports a
    # readable git diff on drift.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-beta.lock
      - run: pip install --require-hashes -r requirements-beta.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      - name: Start API server
        run: |
          python -m uvicorn agents.web:app --host 127.0.0.1 --port 8765 > openapi-server.log 2>&1 &
          echo $! > openapi-server.pid
          python - <<'PY'
          import sys
          import time
          import urllib.request

          url = "http://127.0.0.1:8765/openapi.json"
          for _ in range(90):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          sys.exit(0)
              except Exception:
                  time.sleep(1)
          print("OpenAPI server did not become ready", file=sys.stderr)
          sys.exit(1)
          PY
        env:
          JARVIS_TESTING: "1"

      - name: Generate OpenAPI TypeScript
        run: npm run typegen:openapi
        working-directory: frontend

      - name: Generated OpenAPI types are current
        run: |
          git diff --exit-code -- frontend/src/api/schema.gen.ts \
            || { echo "::error::frontend/src/api/schema.gen.ts is stale — run 'cd frontend && npm run typegen:openapi' with the API server on port 8765."; exit 1; }

      - name: Stop API server
        if: ${{ always() }}
        run: |
          if [ -f openapi-server.pid ]; then kill "$(cat openapi-server.pid)" || true; fi

      - name: Upload OpenAPI server log
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: openapi-server-log
          path: openapi-server.log
          if-no-files-found: ignore
          retention-days: 7

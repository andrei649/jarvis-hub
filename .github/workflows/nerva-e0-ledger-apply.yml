name: Nerva E0 ledger apply (one-shot)

on:
  push:
    branches:
      - nerva2/e0-ledger-migrator
    paths:
      - .github/workflows/nerva-e0-ledger-apply.yml

permissions:
  contents: write

concurrency:
  group: nerva-e0-ledger-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: nerva2/e0-ledger-migrator
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-beta.lock
            requirements-dev.lock

      - name: Install locked dependencies
        run: |
          pip install --require-hashes -r requirements-beta.lock
          pip install --require-hashes -r requirements-dev.lock

      - name: Refresh generated project status
        env:
          JARVIS_LATEST_CI_COMMIT: 13290b6a10f2bfce5b10a3bf57305777341c0909
        run: python scripts/status_sync.py --reuse-js-counts

      - name: Apply and verify bounded Nerva ledger blocks
        run: |
          python scripts/reconcile_nerva_repository_ledgers.py --write
          python scripts/reconcile_nerva_repository_ledgers.py --check

      - name: Verify generated and Nerva control state
        env:
          JARVIS_LATEST_CI_COMMIT: 13290b6a10f2bfce5b10a3bf57305777341c0909
        run: |
          python scripts/status_sync.py --check --reuse-js-counts
          python scripts/check_nerva_roadmap.py
          python scripts/check_nerva_e0_completion.py
          python -m pytest tests/test_reconcile_nerva_repository_ledgers.py -q

      - name: Enforce bounded diff and remove one-shot workflow
        shell: bash
        run: |
          test "$(grep -c '<!-- NERVA2:E0-REPOSITORY-LEDGER:START -->' BACKLOG.md)" -eq 1
          test "$(grep -c '<!-- NERVA2:E0-REPOSITORY-LEDGER:END -->' BACKLOG.md)" -eq 1
          test "$(grep -c '<!-- NERVA2:E0-REPOSITORY-LEDGER:START -->' STATUS.md)" -eq 1
          test "$(grep -c '<!-- NERVA2:E0-REPOSITORY-LEDGER:END -->' STATUS.md)" -eq 1
          rm .github/workflows/nerva-e0-ledger-apply.yml
          allowed='^(.github/workflows/nerva-e0-ledger-apply.yml|BACKLOG.md|STATUS.md|README.md|NERVA.md|GO_LIVE_PLAN.md|project-status.json)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected generated files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git diff --check

      - name: Commit generated reconciliation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(nerva2): reconcile repository ledgers and generated status"
          git push origin HEAD:nerva2/e0-ledger-migrator

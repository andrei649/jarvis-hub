name: Self-development policy

on:
  pull_request:
    paths:
      - "selfdev-policy.json"
      - "scripts/selfdev_policy.py"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "AGENTS.md"
      - "MAX.md"
      - "agents/core/kernel/**"
      - "agents/core/security/**"
      - "agents/core/secret*"
  push:
    branches: [main]
    paths:
      - "selfdev-policy.json"
      - "scripts/selfdev_policy.py"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "AGENTS.md"
      - "MAX.md"
      - "agents/core/kernel/**"
      - "agents/core/security/**"
      - "agents/core/secret*"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate policy schema and invariants
        run: python scripts/selfdev_policy.py validate
      - name: Run root-of-trust regression pack
        run: python scripts/selfdev_policy.py selftest

name: Security

# AUD-10 — security CI gates:
#   gitleaks          (F36)      blocking secret scan, allowlist in .gitleaks.toml
#   sast / semgrep    (F35)      advisory SAST (continue-on-error)
#   dependency-audit  (F34)      advisory pip-audit (continue-on-error)
#   bandit            (F34/F35)  blocking SAST, baseline in .bandit-baseline.json
# The advisory lanes flip to blocking once their baselines/ignore-lists land in the
# F33 lockfile follow-up; the blocking lanes already fail only on NEW findings.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan working tree (blocking gate)
        # AUD-10 (F36): blocking secret-scan gate. Known false positives (test
        # fixtures, doc examples, settings-schema key names) are allowlisted in
        # .gitleaks.toml (which extends the default ruleset), so only NEW secrets
        # fail the build. Re-scan locally with the same command after edits.
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
      - name: Semgrep scan (advisory)
        # Advisory (continue-on-error swallows install/registry hiccups too): surfaces
        # static-analysis findings without gating. Flips to blocking in the CI-gates
        # follow-up, with a baselined ruleset so only *new* findings fail (F35).
        continue-on-error: true
        run: |
          python -m pip install --quiet 'semgrep==1.167.0'
          semgrep scan --config p/python --config p/security-audit \
            --error --quiet --metrics off --disable-version-check \
            agents worldview

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
      - name: pip-audit (advisory)
        # Advisory (continue-on-error): reports known CVEs in the dependency set
        # without gating. Flips to blocking in the CI-gates follow-up, against the
        # hashed lockfile (F33) + a committed ignore-list of triaged advisories (F34).
        continue-on-error: true
        run: |
          python -m pip install --quiet 'pip-audit==2.10.1'
          pip-audit -r requirements-beta.txt --desc

  bandit:
    name: SAST (bandit — blocking gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
      - name: Bandit (blocking, baselined)
        # AUD-10 (F34/F35): blocking SAST gate over the hub source. Pre-existing
        # findings are frozen in .bandit-baseline.json so this fails only on NEW
        # issues. Regenerate the baseline after an intentional change with:
        #   python -m bandit -r agents scripts -q -f json -o .bandit-baseline.json
        run: |
          python -m pip install --quiet 'bandit==1.9.4'
          python -m bandit -r agents scripts -q -b .bandit-baseline.json

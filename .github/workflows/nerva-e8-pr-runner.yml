name: Nerva E8 bounded correction runner

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'nerva2/e8-0-synapse-conformance'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply bounded identity and signing corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          from pathlib import Path

          def block(lines):
              return "\n".join(lines) + "\n"

          def replace_once(text, old_lines, new_lines, label):
              old = block(old_lines)
              new = block(new_lines)
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"{label} anchor missing")
              return text.replace(old, new, 1)

          code_path = Path("agents/core/synapse_manifest.py")
          code = code_path.read_text(encoding="utf-8")
          code = replace_once(
              code,
              [
                  '_SEMVER = re.compile(r"^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$")',
                  '_RFC3339 = re.compile(',
              ],
              [
                  '_SEMVER = re.compile(r"^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$")',
                  '_CAPABILITY_ID = re.compile(',
                  '    r"^[a-z][a-z0-9_-]*:[a-z0-9](?:[a-z0-9._*-]*[a-z0-9*])?$"',
                  ')',
                  '_PACKAGE_DIGEST = re.compile(r"^(?:sha256|hmac-sha256):[0-9a-f]{64}$")',
                  '_AUTHENTICATED_PACKAGE_DIGEST = re.compile(r"^hmac-sha256:[0-9a-f]{64}$")',
                  '_RFC3339 = re.compile(',
              ],
              "constants",
          )
          code = replace_once(
              code,
              [
                  '    if not manifest.id.strip() or not manifest.description.strip():',
                  '        raise ValueError("capability id and description are required")',
              ],
              [
                  '    if _CAPABILITY_ID.fullmatch(manifest.id) is None:',
                  '        raise ValueError("capability id must use canonical namespace:name syntax")',
                  '    if not manifest.description.strip():',
                  '        raise ValueError("capability description is required")',
              ],
              "identity validation",
          )
          code = replace_once(
              code,
              [
                  '    if value.package_digest is not None and (',
                  '        not isinstance(value.package_digest, str) or not value.package_digest.strip()',
                  '    ):',
                  '        raise ValueError("package digest must be a non-empty string or null")',
                  '    if value.trust_state == "signed" and not value.package_digest:',
                  '        raise ValueError("signed capability requires a package digest")',
              ],
              [
                  '    if value.package_digest is not None and (',
                  '        not isinstance(value.package_digest, str)',
                  '        or _PACKAGE_DIGEST.fullmatch(value.package_digest) is None',
                  '    ):',
                  '        raise ValueError(',
                  '            "package digest must be sha256:<64 lowercase hex> or "',
                  '            "hmac-sha256:<64 lowercase hex>"',
                  '        )',
                  '    if value.trust_state == "signed" and (',
                  '        not value.package_digest',
                  '        or _AUTHENTICATED_PACKAGE_DIGEST.fullmatch(value.package_digest) is None',
                  '    ):',
                  '        raise ValueError(',
                  '            "signed capability requires authenticated HMAC-SHA256 package evidence"',
                  '        )',
              ],
              "provenance validation",
          )
          code_path.write_text(code, encoding="utf-8")

          tests_path = Path("tests/test_h27_capability_manifests.py")
          tests = tests_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              [
                  '    with pytest.raises(ValueError, match="finite"):',
                  '        replace(',
                  '            synapse,',
                  '            telemetry=replace(',
                  '                synapse.telemetry,',
                  '                reliability=float("nan"),',
                  '                measurement_source="fixture",',
                  '            ),',
                  '        )',
                  '',
                  '    for implementation in (',
              ],
              [
                  '    with pytest.raises(ValueError, match="finite"):',
                  '        replace(',
                  '            synapse,',
                  '            telemetry=replace(',
                  '                synapse.telemetry,',
                  '                reliability=float("nan"),',
                  '                measurement_source="fixture",',
                  '            ),',
                  '        )',
                  '',
                  '    for capability_id in (',
                  '        " action:example.run",',
                  '        "action:example.run ",',
                  '        "Action:example.run",',
                  '        "action:Example.run",',
                  '        "action:example/run",',
                  '        "action::example.run",',
                  '        "action:.example.run",',
                  '    ):',
                  '        with pytest.raises(ValueError, match="canonical namespace:name"):',
                  '            adapt_capability_manifest(',
                  '                _manifest(id=capability_id, requires=("plugin.enabled",))',
                  '            )',
                  '    with pytest.raises(ValueError, match="action-kernel"):',
                  '        adapt_capability_manifest(_manifest(requires=("plugin.enabled",)))',
                  '    assert adapt_capability_manifest(_manifest(id="action:social.*")).id == (',
                  '        "action:social.*"',
                  '    )',
                  '',
                  '    for implementation in (',
              ],
              "identity regression",
          )
          tests = replace_once(
              tests,
              ['def test_plugin_defaults_are_conservative_for_transmitted_and_disabled_plugins():'],
              [
                  'def test_plugin_defaults_are_conservative_for_transmitted_and_disabled_plugins(',
                  '    tmp_path, monkeypatch',
                  '):',
              ],
              "plugin defaults function",
          )
          tests = replace_once(
              tests,
              [
                  '    with pytest.raises(ValueError, match="generated flag"):',
                  '        replace(',
                  '            quarantined,',
                  '            provenance=replace(quarantined.provenance, generated=1),',
                  '        )',
              ],
              [
                  '    with pytest.raises(ValueError, match="generated flag"):',
                  '        replace(',
                  '            quarantined,',
                  '            provenance=replace(quarantined.provenance, generated=1),',
                  '        )',
                  '',
                  '    from agents.core.skills.signing import sign_skill, verify_skill',
                  '',
                  '    with pytest.raises(ValueError, match="package digest"):',
                  '        adapt_capability_manifest(source, package_digest="deadbeef")',
                  '    integrity_only = "sha256:" + "0" * 64',
                  '    with pytest.raises(ValueError, match="authenticated HMAC-SHA256"):',
                  '        adapt_capability_manifest(',
                  '            source,',
                  '            trust_state="signed",',
                  '            package_digest=integrity_only,',
                  '        )',
                  '',
                  '    skill_dir = tmp_path / "signed-skill"',
                  '    skill_dir.mkdir()',
                  '    (skill_dir / "SKILL.md").write_text("# Signed fixture\\n", encoding="utf-8")',
                  '    (skill_dir / "main.py").write_text("VALUE = 1\\n", encoding="utf-8")',
                  '    monkeypatch.setenv("JARVIS_SKILL_SIGNING_KEY", "e8-test-signing-key")',
                  '    signature = sign_skill(skill_dir)',
                  '    assert signature.startswith("hmac-sha256:")',
                  '    assert verify_skill(skill_dir) == (True, "signed")',
                  '    signed = adapt_capability_manifest(',
                  '        source,',
                  '        trust_state="signed",',
                  '        package_digest=signature,',
                  '        source_ref="agents.core.skills.signing:verify_skill",',
                  '    )',
                  '    assert signed.provenance.package_digest == signature',
                  '    assert signed.provenance.trust_state == "signed"',
              ],
              "signing regression",
          )
          tests_path.write_text(tests, encoding="utf-8")

          doc_path = Path("docs/nerva2/SYNAPSE_E8_0.md")
          doc = doc_path.read_text(encoding="utf-8")
          heading = "## Canonical identity and signing evidence"
          if heading not in doc:
              doc += "\n\n" + block([
                  heading,
                  "",
                  "Capability identifiers use a canonical lowercase `namespace:name` profile with no",
                  "surrounding whitespace. Existing bounded wildcard forms such as `action:social.*`",
                  "remain valid, while whitespace-, case-, slash-, duplicate-separator-, and leading-dot",
                  "variants fail closed before the `action:` to `action-kernel` requirement is evaluated.",
                  "",
                  "Package evidence uses the existing signing wire forms: `sha256:<64 lowercase hex>` is",
                  "integrity-only, while `hmac-sha256:<64 lowercase hex>` is keyed evidence.",
                  "`trust_state=\"signed\"` therefore rejects plain SHA-256 and requires the HMAC form.",
                  "Synapse only projects evidence established by the existing",
                  "`agents.core.skills.signing.verify_skill` path; it does not possess the signing key,",
                  "authenticate a signer itself, install or promote packages, authorize execution, or mark",
                  "a capability verified. Ultron and the existing Action Kernel remain authoritative.",
              ])
          doc_path.write_text(doc, encoding="utf-8")
          PY
          rm -f .github/workflows/nerva-e8-builder-fix.yml
          rm -f .github/workflows/nerva-e8-pr-runner.yml
          rm -f .github/e8-builder-trigger.txt
          git add -A
          git commit -m "fix(nerva): harden E8 identity and signing evidence"
          git push origin HEAD:nerva2/e8-0-synapse-conformance

name: Eval Nightly

on:
  workflow_dispatch:
  schedule:
    # Daily 02:30 UTC: cheap deterministic quality gate before the day starts.
    - cron: "30 2 * * *"
  pull_request:
    paths:
      - "agents/core/observability/**"
      - "agents/core/reflection_evaluation.py"
      - "tests/test_companion_eval*.py"
      - "tests/_nerva_e9_1_checks.py"
      - "tests/_nerva_e6_1_checks.py"
      - "tests/test_daily_reflection.py"
      - "docs/nerva2/REFLECTION_E6_1.md"
      - ".github/workflows/eval-nightly.yml"

permissions:
  contents: read

concurrency:
  group: eval-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  companion-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Default-off: live model evals are opt-in for owner-controlled runners.
      JARVIS_EVAL_LIVE: ${{ vars.JARVIS_EVAL_LIVE || '0' }}
      # Cache this exact DatasetStore root so scheduled run N+1 compares against run N.
      JARVIS_EVAL_STORE: ${{ github.workspace }}/.jarvis-eval-cache/eval
      JARVIS_EVAL_CACHE_PREFIX: eval-nightly-ubuntu-companion-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Restore companion eval baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.JARVIS_EVAL_STORE }}
          key: ${{ env.JARVIS_EVAL_CACHE_PREFIX }}-${{ hashFiles('agents/core/observability/companion_dialogues.json', 'agents/core/observability/companion_eval.py') }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.JARVIS_EVAL_CACHE_PREFIX }}-${{ hashFiles('agents/core/observability/companion_dialogues.json', 'agents/core/observability/companion_eval.py') }}-

      - name: Companion eval gate
        run: python -m agents.core.observability.companion_eval --ci-gate --store-root "$JARVIS_EVAL_STORE" --summary "$GITHUB_STEP_SUMMARY"

      - name: Live eval opt-in status
        if: ${{ always() }}
        run: |
          if [ "$JARVIS_EVAL_LIVE" = "1" ]; then
            echo "Live eval requested for this runner; companion gate reports the request and remains deterministic unless a live runner is injected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Live eval is off (JARVIS_EVAL_LIVE=0); deterministic companion gate only." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save companion eval baseline
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.JARVIS_EVAL_STORE }}
          key: ${{ env.JARVIS_EVAL_CACHE_PREFIX }}-${{ hashFiles('agents/core/observability/companion_dialogues.json', 'agents/core/observability/companion_eval.py') }}-${{ github.run_id }}

  # E9.1 (#807) — scheduled current-router shadow comparison. Synthetic-public
  # fixtures only, evaluation-only authority: this lane reports, it never changes
  # production routing, promotes a capability, or claims owner-hardware numbers.
  # Evidence is retained through the accepted E9.0 BenchmarkStore. There are two
  # distinct retention surfaces: an always() artifact that keeps every completed
  # run and report (including regressed ones), and a success()-gated cache that
  # advances the comparison baseline. Neither holds owner or provider data.
  nerva-router-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Cache this exact BenchmarkStore root so scheduled run N+1 has run N to
      # compare against. A cache miss is reported as "no_baseline", never as a
      # fabricated pass.
      NERVA_BENCH_STORE: ${{ github.workspace }}/.nerva-bench-cache/e9-1
      NERVA_BENCH_REPORT: ${{ github.workspace }}/.nerva-bench-cache/e9-1-report.json
      NERVA_BENCH_CACHE_PREFIX: nerva-router-shadow-ubuntu-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Restore scheduled shadow baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.NERVA_BENCH_STORE }}
          key: ${{ env.NERVA_BENCH_CACHE_PREFIX }}-${{ hashFiles('agents/core/observability/scheduled_report.py', 'agents/core/observability/benchmark.py') }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.NERVA_BENCH_CACHE_PREFIX }}-${{ hashFiles('agents/core/observability/scheduled_report.py', 'agents/core/observability/benchmark.py') }}-

      - name: Scheduled router shadow comparison
        id: shadow
        run: |
          python -m agents.core.observability.scheduled_report \
            --store-root "$NERVA_BENCH_STORE" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json-out "$NERVA_BENCH_REPORT" \
            --revision "$GITHUB_SHA" \
            --runner-id "github-${{ runner.os }}-${{ runner.arch }}" \
            --fail-on-regression

      # Evidence retention is deliberately separate from baseline promotion.
      # This runs on always(), so a regressed or failed run — exactly the
      # evidence #807 requires to stay visible — is retained and reproducible
      # even though the step above exited non-zero.
      - name: Upload scheduled shadow evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nerva-router-shadow-evidence-${{ github.run_id }}
          path: |
            ${{ env.NERVA_BENCH_STORE }}
            ${{ env.NERVA_BENCH_REPORT }}
          if-no-files-found: warn
          retention-days: 14

      # Baseline promotion stays gated on success(): a regressed or failed run
      # is retained above but must never silently become the accepted
      # comparison baseline for the next scheduled run.
      - name: Save scheduled shadow baseline
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.NERVA_BENCH_STORE }}
          key: ${{ env.NERVA_BENCH_CACHE_PREFIX }}-${{ hashFiles('agents/core/observability/scheduled_report.py', 'agents/core/observability/benchmark.py') }}-${{ github.run_id }}

  # B4 (handoff 2026-07-07) — the ci-small-model ADVISORY lane: live generation
  # through a tiny OSS model on the GitHub runner, deterministic rubric scoring.
  # Opt-in via the repo variable JARVIS_EVAL_CI_SMALL_MODEL=1 (zero cost until the
  # owner flips it). This is the trend lane — NOT the owner-box fidelity lane
  # (JARVIS_EVAL_LIVE), which stays owner-gated on real hardware.
  live-small-model:
    if: ${{ vars.JARVIS_EVAL_CI_SMALL_MODEL == '1' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JARVIS_EVAL_STORE: ${{ github.workspace }}/.jarvis-eval-cache/eval-small
      SMALL_MODEL: ${{ vars.JARVIS_EVAL_CI_SMALL_MODEL_ID || 'qwen2.5:0.5b' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install runtime deps
        run: pip install -r requirements-beta.txt
      - name: Install and serve Ollama + pull the small model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          ollama pull "$SMALL_MODEL"
      - name: Restore small-model eval baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.JARVIS_EVAL_STORE }}
          key: eval-nightly-small-model-v1-${{ github.run_id }}
          restore-keys: |
            eval-nightly-small-model-v1-
      - name: Run the ci-small-model lane (advisory)
        run: |
          python -m agents.core.observability.companion_eval --live-model \
            --base-url http://127.0.0.1:11434/v1 --model "$SMALL_MODEL" \
            --store-root "$JARVIS_EVAL_STORE" --summary "$GITHUB_STEP_SUMMARY"
      - name: Save small-model eval baseline
        if: ${{ success() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.JARVIS_EVAL_STORE }}
          key: eval-nightly-small-model-v1-${{ github.run_id }}

  # E6.1 (#817) — fixed synthetic-public held-out lesson comparison. This job
  # retains evaluation evidence only. It has no cache/promotion step and never
  # consumes owner/private fixtures or a live provider/model.
  nerva-lesson-held-out:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NERVA_LESSON_EVAL_STORE: ${{ github.workspace }}/.nerva-e6-1/store
      NERVA_LESSON_EVAL_REPORT: ${{ github.workspace }}/.nerva-e6-1/report.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Synthetic held-out lesson evaluation
        run: |
          python -m agents.core.reflection_evaluation \
            --store-root "$NERVA_LESSON_EVAL_STORE" \
            --json-out "$NERVA_LESSON_EVAL_REPORT" \
            --revision "$GITHUB_SHA" \
            --runner-id "github-e6-1" \
            --fail-on-regression

      # A negative result is evidence, not a discarded run or a new baseline.
      - name: Upload held-out lesson evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nerva-e6-1-held-out-${{ github.run_id }}
          path: |
            ${{ env.NERVA_LESSON_EVAL_STORE }}
            ${{ env.NERVA_LESSON_EVAL_REPORT }}
          if-no-files-found: warn
          retention-days: 14

name: H011 Windows native read and private store

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h011-windows-native-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-read-and-store:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-beta.lock
      - run: pip install --require-hashes -r requirements-beta.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Ruff native primitive
        run: >-
          ruff check agents/core/checkpoint_windows_fs.py agents/core/checkpoint_windows_store.py
          tests/test_h011_windows_native_fs.py tests/test_h011_windows_store.py
      - name: Native synthetic NTFS tests
        run: >-
          python -m pytest tests/test_h011_windows_native_fs.py tests/test_h011_windows_store.py
          -v --tb=short -s
          --junitxml=h011-native-junit.xml
        env:
          JARVIS_TESTING: "1"
      - name: Require actual Windows execution of every native case
        shell: pwsh
        run: |
          @'
          import sys
          import xml.etree.ElementTree as ET
          assert sys.platform == 'win32', sys.platform
          root = ET.parse('h011-native-junit.xml').getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          assert suite is not None
          counts = {key: int(suite.get(key, '-1')) for key in ('tests', 'failures', 'errors', 'skipped')}
          print('H011 native Windows JUnit:', counts)
          assert counts['tests'] >= 65 and all(counts[key] == 0 for key in ('failures', 'errors', 'skipped'))
          '@ | python -

name: Reality Harness

# ORIZONT 24 Track V1 — run each capability's *reality* contract against the real rail
# (not a mock) and fail if a contract regresses. Additive and OFF the PR critical path:
# it runs only on a schedule + on demand, never on pull_request, so it can never block a
# merge. JARVIS_REALITY_HARNESS=1 also enables the *live* (keyed/networked) cases; today's
# seeded cases are hermetic (the egress-policy rail), so this is the scaffold the per-
# capability live contracts plug into as Track V fills in.
on:
  workflow_dispatch:
  schedule:
    # 04:00 UTC daily — off-hours, offset from the third-party sweeps.
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  group: reality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-beta.lock
      # Hash-pinned install (AUD-10/F33), same as ci.yml.
      - run: pip install --require-hashes -r requirements-beta.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Reality contracts (live mode on)
        run: python -m pytest tests/test_reality_harness.py -q --timeout=90 --tb=short
        env:
          JARVIS_TESTING: "1"
          JARVIS_REALITY_HARNESS: "1"
      # GAP-9: persist the run as evidence. Retention is deliberately separate
      # from promotion (the eval-nightly pattern): the ledger records the
      # transcript with promotion_scope=in_process_only; nothing reads it back,
      # so V3's no-durable-promotion constraint is untouched. always() keeps a
      # red run as evidence too.
      - name: Record reality evidence
        if: ${{ always() }}
        run: >-
          python -m agents.core.observability.reality_evidence
          --store-root reality-evidence
          --json-out reality-evidence/latest-run.json
          --lane scheduled
          --revision "$GITHUB_SHA"
          --runner-id "github-actions"
        env:
          JARVIS_TESTING: "1"
          JARVIS_REALITY_HARNESS: "1"
      - name: Upload reality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: reality-evidence
          path: reality-evidence/
          if-no-files-found: warn
          retention-days: 14

  # WV-170 (GitHub issue #170) — Neo4jGraph.search()'s property-scanning Cypher
  # (H19.3.5) had only ever been exercised against httpx mocks or an
  # unreachable port; this validates it against a real Neo4j, same
  # never-blocks-a-PR boundary as the `reality` job above.
  neo4j-live:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: none
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget -q -O- http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-beta.lock
      - run: pip install --require-hashes -r requirements-beta.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      # The lane's first real run failed with "no Neo4j reachable" while the service
      # container logged "Started." — print the transactional endpoint's actual answer
      # so the next such failure is diagnosable from the log alone. Deliberately left
      # fatal: curl without --fail exits 0 on any HTTP status and only fails on a
      # connection error, which is exactly the condition that should stop the job.
      - name: Probe the Neo4j HTTP API
        run: |
          curl -sS -i -X POST http://localhost:7474/db/neo4j/tx/commit \
            -H 'Content-Type: application/json' \
            -d '{"statements":[{"statement":"RETURN 1"}]}' | head -30
      - name: Neo4j live property-search (WV-170)
        run: python -m pytest tests/test_neo4j_live_property_search.py -v --timeout=60 --tb=short
        env:
          JARVIS_TESTING: "1"
          JARVIS_NEO4J_LIVE: "1"
          NEO4J_URL: "http://localhost:7474"

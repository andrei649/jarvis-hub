name: Temporary E9 status sync

on:
  push:
    branches:
      - nerva2/e9-benchmark-contract-v2

permissions:
  contents: write

concurrency:
  group: temporary-e9-status-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[status-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: nerva2/e9-benchmark-contract-v2
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-beta.txt
            requirements-dev.txt
      - name: Install collection dependencies
        run: python -m pip install -r requirements-beta.txt -r requirements-dev.txt
      - name: Refresh canonical status surfaces
        env:
          JARVIS_LATEST_CI_COMMIT: a48a2d0c71f441bc0ad719920e024a4dc44378a6
        run: python scripts/status_sync.py --reuse-js-counts
      - name: Commit generated surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-status.json README.md NERVA.md GO_LIVE_PLAN.md STATUS.md
          if git diff --cached --quiet; then
            echo "Generated status surfaces already match."
            exit 0
          fi
          git commit -m "chore(status): refresh E9 generated surfaces [status-sync]"
          git push origin HEAD:nerva2/e9-benchmark-contract-v2

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts only; do not create a GitHub Release"
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # Decided ONCE, here, and consumed downstream. Two jobs each working out
    # whether a tag is a prerelease is how one lands in both channels, or in
    # neither — the same failure the generator's own tests guard against.
    outputs:
      channel: ${{ steps.packaging.outputs.channel }}
      version: ${{ steps.packaging.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify tag matches agents.__version__
        if: github.ref_type == 'tag'
        run: |
          VERSION="$(python3 -c 'import re,io; print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", open("agents/__init__.py").read()).group(1))')"
          if [ "refs/tags/v${VERSION}" != "${GITHUB_REF}" ]; then
            echo "::error::tag ${GITHUB_REF} does not match agents.__version__ (v${VERSION}). Bump agents/__init__.py before tagging."
            exit 1
          fi
          echo "tag matches v${VERSION}"

      - name: Build release artifacts (tar/zip + SBOM + NOTICE + checksums)
        run: bash scripts/build_release.sh dist

      # Package-manager manifests and the channel decision. Generated FROM the
      # checksums that were just built rather than from a committed template: a
      # cask with a stale sha256 fails on a user's machine at install time, which
      # is the worst place to discover a release-tooling bug.
      - name: Generate package-manager manifests
        id: packaging
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" != "push" ]; then
            VERSION="$(python3 -c 'import re; print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", open("agents/__init__.py").read()).group(1))')"
          fi
          python3 scripts/gen_package_manifests.py \
            --dist dist --version "$VERSION" \
            --repo "${GITHUB_REPOSITORY}" --out dist/packaging
          CHANNEL="$(python3 -c 'import json;print(json.load(open("dist/packaging/channel.json"))["channel"])')"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::release channel is ${CHANNEL}"

      # Optional: detached GPG signatures. Skipped unless the owner has configured
      # the GPG_PRIVATE_KEY secret (signing keys are owner-managed — see docs/RELEASE.md).
      - name: Sign artifacts with GPG (optional)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in dist/jarvis-*.tar.gz dist/jarvis-*.zip dist/SHA256SUMS; do
            gpg --batch --yes --pinentry-mode loopback \
                ${GPG_PASSPHRASE:+--passphrase "$GPG_PASSPHRASE"} \
                --armor --detach-sign "$f"
          done
          echo "signed: $(ls dist/*.asc)"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/jarvis-*.tar.gz
            dist/jarvis-*.zip
            dist/SBOM.json
            dist/NOTICE
            dist/SHA256SUMS
            dist/*.asc
            dist/packaging/*

  # `docker run` is the third install path, and the only one that behaves
  # identically on every OS. The image is only ever tagged `stable` for a plain
  # release: promoting a release candidate because a shell conditional was loose
  # is how a knowingly-unfinished build reaches everyone who pulls `:stable`.
  image:
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/nerva:${{ needs.release.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/nerva:${{ needs.release.outputs.channel }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

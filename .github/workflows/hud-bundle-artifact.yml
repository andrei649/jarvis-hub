name: HUD Bundle Artifact

on:
  pull_request:

permissions:
  contents: write

jobs:
  bundle:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/companion-eval-quality-gates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Commit generated HUD bundle and remove helper
        run: |
          rm .github/workflows/hud-bundle-artifact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/web/v2 .github/workflows/hud-bundle-artifact.yml
          git diff --cached --quiet && exit 0
          git commit -m "build: refresh hud v2 bundle"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

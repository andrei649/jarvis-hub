name: Nerva E3 branch maintenance

on:
  push:
    branches:
      - nerva2/e3-0-episodes-manual-boundaries

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out E3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: nerva2/e3-0-episodes-manual-boundaries
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Reconcile main and apply mechanical lint fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "docs/nerva2/M1_DELIVERY.md" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --ours docs/nerva2/M1_DELIVERY.md
            git add docs/nerva2/M1_DELIVERY.md
            git commit --no-edit
          fi

          python -m pip install --disable-pip-version-check ruff==0.16.1
          ruff check --fix \
            agents/core/memory/_episode_operations.py \
            agents/core/memory/_episode_values.py
          ruff check \
            agents/core/memory/_episode_operations.py \
            agents/core/memory/_episode_values.py
          python -m py_compile \
            agents/core/memory/_episode_operations.py \
            agents/core/memory/_episode_values.py \
            agents/core/memory/episodes.py \
            tests/_nerva_e3_0_checks.py \
            tests/test_h14_1_bitemporal_kg.py

          rm .github/workflows/nerva-e3-autofix.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(nerva): refresh E3 branch and satisfy lint"
          fi
          git push origin HEAD:nerva2/e3-0-episodes-manual-boundaries

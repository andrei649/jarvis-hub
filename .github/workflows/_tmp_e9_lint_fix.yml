name: Temporary E9 lint fix

on:
  push:
    branches:
      - nerva2/e9-benchmark-contract-v2

permissions:
  contents: write

concurrency:
  group: temporary-e9-lint-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[lint-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: nerva2/e9-benchmark-contract-v2
      - name: Apply bounded Ruff correction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("agents/core/observability/benchmark.py")
          text = path.read_text(encoding="utf-8")
          old = (
              '    if measurement.status == "measured":\n'
              '        if measurement.unit != "classification" or measurement.value not in _PRIVACY_EFFECTS:\n'
              '            raise ValueError("privacy must use a supported classification")\n'
          )
          new = (
              '    if (\n'
              '        measurement.status == "measured"\n'
              '        and (\n'
              '            measurement.unit != "classification"\n'
              '            or measurement.value not in _PRIVACY_EFFECTS\n'
              '        )\n'
              '    ):\n'
              '        raise ValueError("privacy must use a supported classification")\n'
          )
          if old not in text:
              raise SystemExit("expected Ruff correction anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
      - name: Commit bounded correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/core/observability/benchmark.py
          git commit -m "fix(nerva): satisfy E9 privacy validation lint [lint-fix]"
          git push origin HEAD:nerva2/e9-benchmark-contract-v2

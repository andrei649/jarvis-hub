name: Code Health

# Advisory static-analysis pass (lint, format, dead-code, complexity).
# Non-blocking by design — Jarvis ships "verde devreme peste perfecțiune".
# It surfaces improvement candidates without gating merges.
on:
  pull_request:
    paths:
      - "**.py"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - "requirements-dev.lock"
      - ".github/workflows/code-health.yml"
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC — a weekly health digest on the default branch.
    - cron: "0 6 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install code-health toolchain
        # AUD-10 (F33): hash-pinned install (lock regenerated by ./scripts/lock_deps.sh).
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Run code-health pass
        run: |
          python scripts/code_health.py | tee code_health.txt
          python scripts/code_health.py --json > code_health.json

      - name: Publish digest to job summary
        if: always()
        run: |
          {
            echo '## 🩺 Code health digest'
            echo '```'
            cat code_health.txt
            echo '```'
            echo '_Advisory only — does not block this PR. Run locally with `python scripts/code_health.py`._'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: code-health-report
          path: |
            code_health.txt
            code_health.json
          retention-days: 30

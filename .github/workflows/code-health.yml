name: Code Health

permissions:
  contents: read

# Static-analysis findings are advisory. Missing/crashed analyzers are an
# infrastructure failure and fail closed so a green job always means the pinned
# toolchain actually ran.
on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC — a weekly health digest on the default branch.
    - cron: "0 6 * * 1"

concurrency:
  group: code-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install code-health toolchain
        # AUD-10 (F33): hash-pinned install (lock regenerated by ./scripts/lock_deps.sh).
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Run code-health pass
        run: |
          set -o pipefail
          python scripts/code_health.py --json-output code_health.json | tee code_health.txt

      - name: Publish digest to job summary
        if: always()
        run: |
          {
            echo '## 🩺 Code health digest'
            echo '```'
            if [[ -f code_health.txt ]]; then
              cat code_health.txt
            else
              echo 'Code-health execution did not produce a text report.'
            fi
            echo '```'
            echo '_Findings are advisory; missing/crashed analyzers fail the job. Run locally with `python scripts/code_health.py`._'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: code-health-report
          path: |
            code_health.txt
            code_health.json
          retention-days: 30

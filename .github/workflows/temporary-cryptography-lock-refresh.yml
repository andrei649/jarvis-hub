name: Temporary cryptography lock refresh

on:
  push:
    branches:
      - security/cryptography-50-cve-2026-69247

permissions:
  contents: write

concurrency:
  group: temporary-cryptography-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install canonical lock compiler
        run: python -m pip install --disable-pip-version-check uv

      - name: Preserve accepted pins except the remediated package
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          for lock_name, output_name in (
              ("requirements.lock", "/tmp/core-constraints.txt"),
              ("requirements-beta.lock", "/tmp/beta-constraints.txt"),
          ):
              text = subprocess.check_output(
                  ["git", "show", f"origin/main:{lock_name}"],
                  text=True,
              )
              constraints: list[str] = []
              for line in text.splitlines():
                  if not line or line[0].isspace() or line.startswith("#") or "==" not in line:
                      continue
                  requirement = re.sub(r"\s+\\$", "", line)
                  package = re.split(r"[= ;\[]", requirement, maxsplit=1)[0]
                  if package.lower().replace("_", "-") == "cryptography":
                      continue
                  constraints.append(requirement)
              Path(output_name).write_text("\n".join(constraints) + "\n", encoding="utf-8")
          PY

      - name: Regenerate only the affected universal hash locks
        run: |
          set -euo pipefail
          compile_one() {
            src="$1"
            out="$2"
            constraints="$3"
            tmp="$(mktemp)"
            uv pip compile "$src" \
              --constraint "$constraints" \
              --generate-hashes --universal --python-version 3.12 \
              --no-header --quiet -o "$tmp"
            {
              printf '# AUTOGENERATED by scripts/lock_deps.sh from %s — do not edit by hand.\n' "$src"
              printf '# Regenerate after editing %s:  ./scripts/lock_deps.sh\n' "$src"
              printf '# source-sha256: %s\n' "$(sha256sum "$src" | cut -d' ' -f1)"
              cat "$tmp"
            } > "$out"
            rm -f "$tmp"
          }

          compile_one requirements.txt requirements.lock /tmp/core-constraints.txt
          compile_one requirements-beta.txt requirements-beta.lock /tmp/beta-constraints.txt
          ./scripts/lock_deps.sh --check

      - name: Commit generated lockfiles
        run: |
          set -euo pipefail
          if git diff --quiet -- requirements.lock requirements-beta.lock; then
            echo "Affected lockfiles already match the fixed source constraints."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock requirements-beta.lock
          git commit -m "chore(security): constrain cryptography 50 lock refresh"
          git push origin HEAD:${GITHUB_REF_NAME}

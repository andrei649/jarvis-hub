name: Temporary cryptography lock refresh

on:
  push:
    branches:
      - security/cryptography-50-cve-2026-69247

permissions:
  contents: write

concurrency:
  group: temporary-cryptography-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install canonical lock compiler
        run: python -m pip install --disable-pip-version-check uv

      - name: Compile fixed dependency against accepted pins
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          pairs = (
              ("requirements.txt", "requirements.lock", "/tmp/core-constraints.txt", "/tmp/core-generated.lock"),
              ("requirements-beta.txt", "requirements-beta.lock", "/tmp/beta-constraints.txt", "/tmp/beta-generated.lock"),
          )
          for _source, lock_name, constraints_name, _generated_name in pairs:
              accepted = subprocess.check_output(
                  ["git", "show", f"origin/main:{lock_name}"],
                  text=True,
              )
              constraints: list[str] = []
              for line in accepted.splitlines():
                  if not line or line[0].isspace() or line.startswith("#") or "==" not in line:
                      continue
                  requirement = re.sub(r"\s+\\$", "", line)
                  package = re.split(r"[= ;\[]", requirement, maxsplit=1)[0]
                  if package.lower().replace("_", "-") == "cryptography":
                      continue
                  constraints.append(requirement)
              Path(constraints_name).write_text(
                  "\n".join(constraints) + "\n",
                  encoding="utf-8",
              )
          PY

          uv pip compile requirements.txt \
            --constraint /tmp/core-constraints.txt \
            --generate-hashes --universal --python-version 3.12 \
            --no-header --quiet -o /tmp/core-generated.lock
          uv pip compile requirements-beta.txt \
            --constraint /tmp/beta-constraints.txt \
            --generate-hashes --universal --python-version 3.12 \
            --no-header --quiet -o /tmp/beta-generated.lock

      - name: Preserve unrelated accepted lock content byte-for-byte
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import re
          import subprocess
          from pathlib import Path

          def package_block(text: str, package: str) -> str:
              lines = text.splitlines(keepends=True)
              start = next(
                  index for index, line in enumerate(lines)
                  if line.startswith(f"{package}==")
              )
              end = start + 1
              while end < len(lines):
                  line = lines[end]
                  if line and not line[0].isspace() and not line.startswith("#"):
                      break
                  end += 1
              return "".join(lines[start:end])

          def replace_package(text: str, package: str, replacement: str) -> str:
              lines = text.splitlines(keepends=True)
              start = next(
                  index for index, line in enumerate(lines)
                  if line.startswith(f"{package}==")
              )
              end = start + 1
              while end < len(lines):
                  line = lines[end]
                  if line and not line[0].isspace() and not line.startswith("#"):
                      break
                  end += 1
              return "".join(lines[:start]) + replacement + "".join(lines[end:])

          for source, lock_name, generated_name in (
              ("requirements.txt", "requirements.lock", "/tmp/core-generated.lock"),
              ("requirements-beta.txt", "requirements-beta.lock", "/tmp/beta-generated.lock"),
          ):
              accepted = subprocess.check_output(
                  ["git", "show", f"origin/main:{lock_name}"],
                  text=True,
              )
              generated = Path(generated_name).read_text(encoding="utf-8")
              replacement = package_block(generated, "cryptography")
              if not replacement.startswith("cryptography==50.0.0"):
                  raise SystemExit(f"{lock_name}: resolver did not select cryptography 50.0.0")
              updated = replace_package(accepted, "cryptography", replacement)
              source_digest = hashlib.sha256(Path(source).read_bytes()).hexdigest()
              updated, count = re.subn(
                  r"(?m)^# source-sha256: [0-9a-f]{64}$",
                  f"# source-sha256: {source_digest}",
                  updated,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"{lock_name}: source digest header is missing or ambiguous")
              Path(lock_name).write_text(updated, encoding="utf-8")
          PY
          ./scripts/lock_deps.sh --check

      - name: Commit bounded lockfiles
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock requirements-beta.lock
          if git diff --cached --quiet; then
            echo "Affected lockfiles already contain the bounded remediation."
            exit 0
          fi
          git commit -m "chore(security): bound cryptography 50 lock refresh"
          git push origin HEAD:${GITHUB_REF_NAME}

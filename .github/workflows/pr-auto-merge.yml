name: Manual PR Integration

# Temporary governance-safe integration lane: an explicitly confirmed sweep of
# open PRs that merges only the
# ones GitHub itself already reports as fully ready. It never makes that
# judgement call itself — it trusts `mergeStateStatus` (computed server-side
# from branch protection: required checks, conflicts, required reviews).
#
# Safety rules (do not weaken without updating AGENTS.md too):
#   - draft PRs are visibility state, not locks, and are never merged.
#   - Nerva and vendored-dependency updates require separate manual integration.
#   - only mergeStateStatus == CLEAN is merged. BLOCKED/DIRTY/BEHIND/UNSTABLE
#     are left for the next explicitly approved manual run — no force-push, no conflict
#     resolution, no rebasing someone else's branch.
#   - re-checked immediately before merging (a same-run earlier merge can
#     turn a CLEAN PR into BEHIND/DIRTY if it touched the same files).
#   - --match-head-commit guards against a push landing between list and
#     merge.
#   - branches are never deleted post-merge (matches this repo's existing
#     convention of keeping merged feature branches around).
#   - squash merge, one commit per PR — matches this repo's existing history.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type MERGE APPROVED PRS to run the bounded integration sweep
        required: true
        type: string

concurrency:
  group: pr-auto-merge
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ inputs.confirm == 'MERGE APPROVED PRS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge PRs that are fully green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          readonly NERVA_BRANCH_PREFIX="nerva2/"
          readonly NERVA_START_MARKER="<!-- NERVA2:MOVEMENT-ATTESTATION:START -->"
          readonly THIRD_PARTY_BRANCH_PREFIX="chore/thirdparty-update-"

          nerva_manual_status() {
            local record="$1"
            jq -e \
              --arg prefix "$NERVA_BRANCH_PREFIX" \
              --arg marker "$NERVA_START_MARKER" \
              'def nerva_path: . == "BACKLOG.md" or . == "STATUS.md" or . == "NERVA.md" or . == "NERVA_VISION.md" or startswith("docs/nerva2/") or test("^scripts/(check_nerva_[^/]*|reconcile_nerva_repository_ledgers)\\.py$") or . == "tests/nerva_check_cases.py" or test("^tests/(_nerva_[^/]*_checks|test_nerva_[^/]*|test_reconcile_nerva_repository_ledgers)\\.py$") or . == ".github/workflows/nerva-roadmap.yml"; (.headRefName | startswith($prefix)) or (.body | contains($marker)) or any(.files[]; .path | nerva_path)' \
              <<<"$record" >/dev/null 2>&1
          }

          thirdparty_manual_status() {
            local record="$1"
            jq -e \
              --arg prefix "$THIRD_PARTY_BRANCH_PREFIX" \
              'def thirdparty_path: . == ".github/third-party-manifest.json" or startswith(".claude/plugins/superpowers/") or . == ".claude/plugins/README.md" or . == "LICENSES/superpowers-MIT.txt" or . == "docs/dev/codebase-memory-mcp.md" or startswith("vendor/") or startswith("vendors/") or startswith("vendored/") or startswith("third_party/") or startswith("third-party/"); (.headRefName | startswith($prefix)) or any(.files[]; .path | thirdparty_path)' \
              <<<"$record" >/dev/null 2>&1
          }

          list_raw=""
          list_status=0
          list_raw="$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,isDraft,mergeStateStatus,headRefOid,headRefName,body,changedFiles,files \
            2>/dev/null)" \
            || list_status=$?
          if [ "$list_status" -ne 0 ]; then
            printf 'Failed to list pull requests; refusing to merge.\n' >&2
            exit "$list_status"
          fi

          prs=""
          list_parse_status=0
          prs="$(jq -s -ce '
            def valid_pr:
              type == "object"
              and ((.number | type) == "number")
              and (.number > 0)
              and ((.number | floor) == .number)
              and ((.isDraft | type) == "boolean")
              and ((.mergeStateStatus | type) == "string")
              and ((.headRefOid | type) == "string")
              and (.headRefOid | test("^[0-9a-f]{40}$"))
              and ((.headRefName | type) == "string")
              and ((.headRefName | length) > 0)
              and ((.body | type) == "string")
              and ((.changedFiles | type) == "number")
              and (.changedFiles > 0)
              and ((.changedFiles | floor) == .changedFiles)
              and ((.files | type) == "array")
              and (.changedFiles == (.files | length))
              and (.files | all(.[];
                type == "object"
                and ((.path | type) == "string")
                and ((.path | length) > 0)))
              and (([.files[].path] | length) == ([.files[].path] | unique | length));

            if length != 1 then
              error("expected exactly one list document")
            elif (.[0] | type) != "array" then
              error("list document must be an array")
            elif ((.[0] | all(.[]; valid_pr)) | not) then
              error("list contains an invalid pull request record")
            elif ((.[0] | map(.number) | length)
                  != (.[0] | map(.number) | unique | length)) then
              error("list contains duplicate pull request numbers")
            else
              .[0] | sort_by(.number)
            end
          ' <<<"$list_raw" 2>/dev/null)" || list_parse_status=$?
          if [ "$list_parse_status" -ne 0 ]; then
            printf 'Invalid pull request list data; refusing to merge.\n' >&2
            exit 1
          fi

          if [ "$(jq -r 'length' <<<"$prs")" -eq 0 ]; then
            printf 'No open PRs.\n'
            exit 0
          fi

          jq -c '.[]' <<<"$prs" | while IFS= read -r pr; do
            number="$(jq -r '.number' <<<"$pr")"
            draft="$(jq -r '.isDraft' <<<"$pr")"
            state="$(jq -r '.mergeStateStatus' <<<"$pr")"
            sha="$(jq -r '.headRefOid' <<<"$pr")"

            thirdparty_status=0
            thirdparty_manual_status "$pr" || thirdparty_status=$?
            case "$thirdparty_status" in
              0)
                printf '#%s: manual vendored-dependency integration required — skipped\n' "$number"
                continue
                ;;
              1) ;;
              *)
                printf 'Fatal third-party policy evaluation error for PR #%s.\n' "$number" >&2
                exit "$thirdparty_status"
                ;;
            esac

            manual_status=0
            nerva_manual_status "$pr" || manual_status=$?
            case "$manual_status" in
              0)
                printf '#%s: manual Nerva integration required — skipped\n' "$number"
                continue
                ;;
              1) ;;
              *)
                printf 'Fatal Nerva policy evaluation error for PR #%s.\n' "$number" >&2
                exit "$manual_status"
                ;;
            esac

            if [ "$draft" = "true" ]; then
              printf '#%s: draft — skipped\n' "$number"
              continue
            fi
            if [ "$state" != "CLEAN" ]; then
              printf '#%s: not CLEAN — skipped\n' "$number"
              continue
            fi

            # Re-check right before merging: an earlier merge in this same
            # run may have turned this PR's overlapping-file state stale.
            recheck_raw=""
            recheck_status=0
            recheck_raw="$(gh pr view "$number" --repo "$REPO" \
              --json number,isDraft,mergeStateStatus,headRefOid,headRefName,body,changedFiles,files \
              2>/dev/null)" \
              || recheck_status=$?
            if [ "$recheck_status" -ne 0 ]; then
              printf '#%s: recheck failed; refusing to merge.\n' "$number" >&2
              exit "$recheck_status"
            fi

            recheck=""
            recheck_parse_status=0
            recheck="$(jq -s -ce '
              def valid_pr:
                type == "object"
                and ((.number | type) == "number")
                and (.number > 0)
                and ((.number | floor) == .number)
                and ((.isDraft | type) == "boolean")
                and ((.mergeStateStatus | type) == "string")
                and ((.headRefOid | type) == "string")
                and (.headRefOid | test("^[0-9a-f]{40}$"))
                and ((.headRefName | type) == "string")
                and ((.headRefName | length) > 0)
                and ((.body | type) == "string")
                and ((.changedFiles | type) == "number")
                and (.changedFiles > 0)
                and ((.changedFiles | floor) == .changedFiles)
                and ((.files | type) == "array")
                and (.changedFiles == (.files | length))
                and (.files | all(.[];
                  type == "object"
                  and ((.path | type) == "string")
                  and ((.path | length) > 0)))
                and (([.files[].path] | length) == ([.files[].path] | unique | length));

              if length != 1 then
                error("expected exactly one recheck document")
              elif ((.[0] | valid_pr) | not) then
                error("recheck contains an invalid pull request record")
              else
                .[0]
              end
            ' <<<"$recheck_raw" 2>/dev/null)" || recheck_parse_status=$?
            if [ "$recheck_parse_status" -ne 0 ]; then
              printf '#%s: invalid recheck data; refusing to merge.\n' "$number" >&2
              exit 1
            fi

            recheck_number="$(jq -r '.number' <<<"$recheck")"
            if [ "$recheck_number" != "$number" ]; then
              printf '#%s: recheck identity mismatch; refusing to merge.\n' "$number" >&2
              exit 1
            fi

            thirdparty_status=0
            thirdparty_manual_status "$recheck" || thirdparty_status=$?
            case "$thirdparty_status" in
              0)
                printf '#%s: manual vendored-dependency integration required at recheck — skipped\n' "$number"
                continue
                ;;
              1) ;;
              *)
                printf 'Fatal third-party policy evaluation error for PR #%s.\n' "$number" >&2
                exit "$thirdparty_status"
                ;;
            esac

            manual_status=0
            nerva_manual_status "$recheck" || manual_status=$?
            case "$manual_status" in
              0)
                printf '#%s: manual Nerva integration required at recheck — skipped\n' "$number"
                continue
                ;;
              1) ;;
              *)
                printf 'Fatal Nerva policy evaluation error for PR #%s.\n' "$number" >&2
                exit "$manual_status"
                ;;
            esac

            recheck_draft="$(jq -r '.isDraft' <<<"$recheck")"
            recheck_state="$(jq -r '.mergeStateStatus' <<<"$recheck")"
            recheck_sha="$(jq -r '.headRefOid' <<<"$recheck")"

            if [ "$recheck_draft" = "true" ]; then
              printf '#%s: draft at recheck — skipped\n' "$number"
              continue
            fi
            if [ "$recheck_state" != "CLEAN" ]; then
              printf '#%s: not CLEAN at recheck — skipped\n' "$number"
              continue
            fi
            if [ "$recheck_sha" != "$sha" ]; then
              printf '#%s: head changed at recheck — skipped\n' "$number"
              continue
            fi

            printf '#%s: CLEAN at validated head — merging (squash)\n' "$number"
            if ! gh pr merge "$number" --repo "$REPO" --squash \
              --match-head-commit "$sha" >/dev/null 2>&1; then
              printf '#%s: merge command failed.\n' "$number" >&2
              exit 1
            fi
          done

name: Hourly PR Auto-Merge

# Nerva's routine engineering lane is owner-out-of-loop. A non-draft PR may
# merge unattended only when ALL of these are true at one validated head:
#   1) GitHub reports the merge state CLEAN;
#   2) the trusted-main self-development policy classifies every changed path
#      as autonomous; and
#   3) at least one automated check is reported and every reported check has
#      completed with success/neutral/skipped — pending/fail/cancel never merge.
#
# The important boundary is where policy is evaluated: this workflow checks out
# `main` and runs `scripts/selfdev_policy.py` from that trusted checkout.
# Candidate PRs never get to supply the classifier that judges themselves.
# Changes to the policy, ANY workflow/action, the Action Kernel/security roots,
# and the other root-of-trust paths are skipped rather than self-authorized.
#
# Safety rules:
#   - draft PRs are never touched;
#   - the head SHA is re-checked immediately before policy/check evaluation;
#   - every changed filename is fetched through the paginated REST endpoint;
#   - every check-run for that exact SHA is fetched through the paginated REST endpoint;
#   - empty/unknown policy or check state fails closed;
#   - --match-head-commit closes the final race between evaluation and merge;
#   - squash merge keeps one rollback unit per PR;
#   - no force-push, conflict resolution or branch deletion occurs here.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "13 * * * *"

concurrency:
  group: pr-auto-merge
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted self-development policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Validate trusted policy
        run: python3 scripts/selfdev_policy.py validate

      - name: Merge autonomous fully-green PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          list_raw=""
          list_status=0
          list_raw="$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,isDraft,mergeStateStatus,headRefOid \
            2>/dev/null)" || list_status=$?
          if [ "$list_status" -ne 0 ]; then
            printf 'Failed to list pull requests; refusing to merge.\n' >&2
            exit "$list_status"
          fi

          prs=""
          list_parse_status=0
          prs="$(jq -s -ce '
            def valid_pr:
              type == "object"
              and ((.number | type) == "number")
              and (.number > 0)
              and ((.number | floor) == .number)
              and ((.isDraft | type) == "boolean")
              and ((.mergeStateStatus | type) == "string")
              and ((.headRefOid | type) == "string")
              and (.headRefOid | test("^[0-9a-f]{40}$"));

            if length != 1 then
              error("expected exactly one list document")
            elif (.[0] | type) != "array" then
              error("list document must be an array")
            elif ((.[0] | all(.[]; valid_pr)) | not) then
              error("list contains an invalid pull request record")
            elif ((.[0] | map(.number) | length)
                  != (.[0] | map(.number) | unique | length)) then
              error("list contains duplicate pull request numbers")
            else
              .[0] | sort_by(.number)
            end
          ' <<<"$list_raw" 2>/dev/null)" || list_parse_status=$?
          if [ "$list_parse_status" -ne 0 ]; then
            printf 'Invalid pull request list data; refusing to merge.\n' >&2
            exit 1
          fi

          if [ "$(jq -r 'length' <<<"$prs")" -eq 0 ]; then
            printf 'No open PRs.\n'
            exit 0
          fi

          jq -c '.[]' <<<"$prs" | while IFS= read -r pr; do
            number="$(jq -r '.number' <<<"$pr")"
            draft="$(jq -r '.isDraft' <<<"$pr")"
            state="$(jq -r '.mergeStateStatus' <<<"$pr")"
            sha="$(jq -r '.headRefOid' <<<"$pr")"

            if [ "$draft" = "true" ]; then
              printf '#%s: draft — skipped\n' "$number"
              continue
            fi
            if [ "$state" != "CLEAN" ]; then
              printf '#%s: not CLEAN — skipped\n' "$number"
              continue
            fi

            recheck_raw=""
            recheck_status=0
            recheck_raw="$(gh pr view "$number" --repo "$REPO" \
              --json number,isDraft,mergeStateStatus,headRefOid \
              2>/dev/null)" || recheck_status=$?
            if [ "$recheck_status" -ne 0 ]; then
              printf '#%s: recheck failed; refusing to merge.\n' "$number" >&2
              exit "$recheck_status"
            fi

            recheck=""
            recheck_parse_status=0
            recheck="$(jq -s -ce '
              def valid_pr:
                type == "object"
                and ((.number | type) == "number")
                and (.number > 0)
                and ((.number | floor) == .number)
                and ((.isDraft | type) == "boolean")
                and ((.mergeStateStatus | type) == "string")
                and ((.headRefOid | type) == "string")
                and (.headRefOid | test("^[0-9a-f]{40}$"));

              if length != 1 then
                error("expected exactly one recheck document")
              elif ((.[0] | valid_pr) | not) then
                error("recheck contains an invalid pull request record")
              else
                .[0]
              end
            ' <<<"$recheck_raw" 2>/dev/null)" || recheck_parse_status=$?
            if [ "$recheck_parse_status" -ne 0 ]; then
              printf '#%s: invalid recheck data; refusing to merge.\n' "$number" >&2
              exit 1
            fi

            recheck_number="$(jq -r '.number' <<<"$recheck")"
            recheck_draft="$(jq -r '.isDraft' <<<"$recheck")"
            recheck_state="$(jq -r '.mergeStateStatus' <<<"$recheck")"
            recheck_sha="$(jq -r '.headRefOid' <<<"$recheck")"

            if [ "$recheck_number" != "$number" ]; then
              printf '#%s: recheck identity mismatch; refusing to merge.\n' "$number" >&2
              exit 1
            fi
            if [ "$recheck_draft" = "true" ]; then
              printf '#%s: draft at recheck — skipped\n' "$number"
              continue
            fi
            if [ "$recheck_state" != "CLEAN" ]; then
              printf '#%s: not CLEAN at recheck — skipped\n' "$number"
              continue
            fi
            if [ "$recheck_sha" != "$sha" ]; then
              printf '#%s: head changed at recheck — skipped\n' "$number"
              continue
            fi

            files=""
            files_status=0
            files="$(gh api --paginate \
              "repos/$REPO/pulls/$number/files?per_page=100" \
              --jq '.[].filename' 2>/dev/null)" || files_status=$?
            if [ "$files_status" -ne 0 ]; then
              printf '#%s: changed-file enumeration failed; refusing to merge.\n' "$number" >&2
              exit "$files_status"
            fi

            classification=""
            classification_status=0
            classification="$(printf '%s\n' "$files" | \
              python3 scripts/selfdev_policy.py classify --stdin \
              2>/dev/null)" || classification_status=$?
            if [ "$classification_status" -ne 0 ]; then
              printf '#%s: self-development policy failed closed.\n' "$number" >&2
              exit "$classification_status"
            fi

            autonomous="$(jq -r '.autonomous_merge' <<<"$classification")"
            if [ "$autonomous" != "true" ]; then
              reason="$(jq -r '.reason' <<<"$classification")"
              hits="$(jq -r '[.protected_hits[].path] | join(", ")' <<<"$classification")"
              printf '#%s: control-plane change (%s)%s — skipped\n' \
                "$number" "$reason" "${hits:+: $hits}"
              continue
            fi

            checks=""
            checks_status=0
            checks="$(gh api --paginate \
              "repos/$REPO/commits/$sha/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv' \
              2>/dev/null)" || checks_status=$?
            if [ "$checks_status" -ne 0 ]; then
              printf '#%s: check-run enumeration failed; refusing to merge.\n' "$number" >&2
              exit "$checks_status"
            fi
            if [ -z "$checks" ]; then
              printf '#%s: no automated checks reported — skipped\n' "$number"
              continue
            fi

            checks_ready=true
            while IFS=$'\t' read -r check_name check_state check_conclusion; do
              if [ -z "$check_name" ] || [ "$check_state" != "completed" ]; then
                checks_ready=false
                break
              fi
              case "$check_conclusion" in
                success|neutral|skipped) ;;
                *)
                  checks_ready=false
                  break
                  ;;
              esac
            done <<<"$checks"

            if [ "$checks_ready" != "true" ]; then
              printf '#%s: automated checks not fully green/completed — skipped\n' "$number"
              continue
            fi

            printf '#%s: CLEAN + autonomous policy + all checks PASS — merging (squash)\n' "$number"
            if ! gh pr merge "$number" --repo "$REPO" --squash \
              --match-head-commit "$sha" >/dev/null 2>&1; then
              printf '#%s: merge command failed.\n' "$number" >&2
              exit 1
            fi
          done

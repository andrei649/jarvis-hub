name: Nerva E8 bounded builder correction

on:
  push:
    branches:
      - nerva2/e8-0-synapse-conformance

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded E8 corrections and refresh base
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          from pathlib import Path

          code_path = Path("agents/core/synapse_manifest.py")
          code = code_path.read_text(encoding="utf-8")

          old = '''_SEMVER = re.compile(r"^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$")
          _RFC3339 = re.compile(
          '''
          new = '''_SEMVER = re.compile(r"^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$")
          _CAPABILITY_ID = re.compile(
              r"^[a-z][a-z0-9_-]*:[a-z0-9](?:[a-z0-9._*-]*[a-z0-9*])?$"
          )
          _PACKAGE_DIGEST = re.compile(r"^(?:sha256|hmac-sha256):[0-9a-f]{64}$")
          _AUTHENTICATED_PACKAGE_DIGEST = re.compile(r"^hmac-sha256:[0-9a-f]{64}$")
          _RFC3339 = re.compile(
          '''
          if old not in code:
              raise SystemExit("missing constants anchor")
          code = code.replace(old, new, 1)

          old = '''    if not manifest.id.strip() or not manifest.description.strip():
              raise ValueError("capability id and description are required")
          '''
          new = '''    if _CAPABILITY_ID.fullmatch(manifest.id) is None:
              raise ValueError("capability id must use canonical namespace:name syntax")
          if not manifest.description.strip():
              raise ValueError("capability description is required")
          '''
          if old not in code:
              raise SystemExit("missing capability id validation anchor")
          code = code.replace(old, new, 1)

          old = '''    if value.package_digest is not None and (
              not isinstance(value.package_digest, str) or not value.package_digest.strip()
          ):
              raise ValueError("package digest must be a non-empty string or null")
          if value.trust_state == "signed" and not value.package_digest:
              raise ValueError("signed capability requires a package digest")
          '''
          new = '''    if value.package_digest is not None and (
              not isinstance(value.package_digest, str)
              or _PACKAGE_DIGEST.fullmatch(value.package_digest) is None
          ):
              raise ValueError(
                  "package digest must be sha256:<64 lowercase hex> or "
                  "hmac-sha256:<64 lowercase hex>"
              )
          if value.trust_state == "signed" and (
              not value.package_digest
              or _AUTHENTICATED_PACKAGE_DIGEST.fullmatch(value.package_digest) is None
          ):
              raise ValueError(
                  "signed capability requires authenticated HMAC-SHA256 package evidence"
              )
          '''
          if old not in code:
              raise SystemExit("missing provenance validation anchor")
          code = code.replace(old, new, 1)
          code_path.write_text(code, encoding="utf-8")

          test_path = Path("tests/test_h27_capability_manifests.py")
          tests = test_path.read_text(encoding="utf-8")

          old = '''from agents.core.plugin_gate import BUILTIN_PLUGINS
          from agents.core.synapse_manifest import (
          '''
          new = '''from agents.core.plugin_gate import BUILTIN_PLUGINS
          from agents.core.skills.signing import sign_skill, verify_skill
          from agents.core.synapse_manifest import (
          '''
          if old not in tests:
              raise SystemExit("missing signing import anchor")
          tests = tests.replace(old, new, 1)

          old = '''    with pytest.raises(ValueError, match="finite"):
              replace(
                  synapse,
                  telemetry=replace(
                      synapse.telemetry,
                      reliability=float("nan"),
                      measurement_source="fixture",
                  ),
              )

              for implementation in (
          '''
          new = '''    with pytest.raises(ValueError, match="finite"):
              replace(
                  synapse,
                  telemetry=replace(
                      synapse.telemetry,
                      reliability=float("nan"),
                      measurement_source="fixture",
                  ),
              )

              for capability_id in (
                  " action:example.run",
                  "action:example.run ",
                  "Action:example.run",
                  "action:Example.run",
                  "action:example/run",
                  "action::example.run",
                  "action:.example.run",
              ):
                  with pytest.raises(ValueError, match="canonical namespace:name"):
                      adapt_capability_manifest(
                          _manifest(id=capability_id, requires=("plugin.enabled",))
                      )
              with pytest.raises(ValueError, match="action-kernel"):
                  adapt_capability_manifest(_manifest(requires=("plugin.enabled",)))
              assert adapt_capability_manifest(_manifest(id="action:social.*")).id == (
                  "action:social.*"
              )

              for implementation in (
          '''
          if old not in tests:
              raise SystemExit("missing capability id test anchor")
          tests = tests.replace(old, new, 1)

          old = '''def test_plugin_defaults_are_conservative_for_transmitted_and_disabled_plugins():
          '''
          new = '''def test_plugin_defaults_are_conservative_for_transmitted_and_disabled_plugins(
              tmp_path, monkeypatch
          ):
          '''
          if old not in tests:
              raise SystemExit("missing plugin defaults function anchor")
          tests = tests.replace(old, new, 1)

          old = '''    with pytest.raises(ValueError, match="generated flag"):
              replace(
                  quarantined,
                  provenance=replace(quarantined.provenance, generated=1),
              )
          '''
          new = '''    with pytest.raises(ValueError, match="generated flag"):
              replace(
                  quarantined,
                  provenance=replace(quarantined.provenance, generated=1),
              )

              with pytest.raises(ValueError, match="package digest"):
                  adapt_capability_manifest(source, package_digest="deadbeef")
              integrity_only = "sha256:" + "0" * 64
              with pytest.raises(ValueError, match="authenticated HMAC-SHA256"):
                  adapt_capability_manifest(
                      source,
                      trust_state="signed",
                      package_digest=integrity_only,
                  )

              skill_dir = tmp_path / "signed-skill"
              skill_dir.mkdir()
              (skill_dir / "SKILL.md").write_text("# Signed fixture\\n", encoding="utf-8")
              (skill_dir / "main.py").write_text("VALUE = 1\\n", encoding="utf-8")
              monkeypatch.setenv("JARVIS_SKILL_SIGNING_KEY", "e8-test-signing-key")
              signature = sign_skill(skill_dir)
              assert signature.startswith("hmac-sha256:")
              assert verify_skill(skill_dir) == (True, "signed")
              signed = adapt_capability_manifest(
                  source,
                  trust_state="signed",
                  package_digest=signature,
                  source_ref="agents.core.skills.signing:verify_skill",
              )
              assert signed.provenance.package_digest == signature
              assert signed.provenance.trust_state == "signed"
          '''
          if old not in tests:
              raise SystemExit("missing signing test anchor")
          tests = tests.replace(old, new, 1)
          test_path.write_text(tests, encoding="utf-8")

          doc_path = Path("docs/nerva2/SYNAPSE_E8_0.md")
          doc = doc_path.read_text(encoding="utf-8")

          old = '''naive timestamps fail closed. Executor implementations use exactly one `module:member`
          separator with non-empty, already-trimmed sides; dotted module and member paths remain
          valid. These checks prevent invalid values such as `NaN`, implicit coercions, or
          non-canonical portable metadata from entering a manifest payload.
          '''
          new = '''naive timestamps fail closed. Capability identifiers use a canonical lowercase
          `namespace:name` profile with no surrounding whitespace; the name permits letters,
          digits, dots, underscores, hyphens and bounded wildcard `*` markers used by existing
          action manifests. This prevents whitespace- or case-disguised action identifiers from
          evading the `action-kernel` requirement. Executor implementations use exactly one
          `module:member` separator with non-empty, already-trimmed sides; dotted module and member
          paths remain valid. These checks prevent invalid values such as `NaN`, implicit
          coercions, or non-canonical portable metadata from entering a manifest payload.
          '''
          if old not in doc:
              raise SystemExit("missing canonical id documentation anchor")
          doc = doc.replace(old, new, 1)

          old = '''Generated capabilities must remain `quarantined`. Signing metadata may establish
          package provenance, but it does not install, promote, authorize, execute, or mark a
          capability verified. Current skill signing, quarantine, approval, Action Kernel, ToolRPC,
          and verification paths remain authoritative.
          '''
          new = '''Generated capabilities must remain `quarantined`. Package evidence uses the existing
          signing wire forms: `sha256:<64 lowercase hex>` is integrity-only, while
          `hmac-sha256:<64 lowercase hex>` is keyed evidence. `trust_state="signed"` therefore
          rejects plain SHA-256 and requires the HMAC form. This remains a structural projection of
          evidence established by the existing `agents.core.skills.signing.verify_skill` path; the
          Synapse validator does not possess the signing key, authenticate a signer, install or
          promote a package, authorize execution, or mark a capability verified. Current skill
          signing, quarantine, approval, Action Kernel, ToolRPC, and verification paths remain
          authoritative.
          '''
          if old not in doc:
              raise SystemExit("missing signing documentation anchor")
          doc = doc.replace(old, new, 1)

          doc = doc.replace(
              "- signed package digest and maintainer provenance.\n",
              "- algorithm-prefixed package integrity/signing evidence and maintainer provenance.\n",
              1,
          )
          doc_path.write_text(doc, encoding="utf-8")
          PY
          rm .github/workflows/nerva-e8-builder-fix.yml
          git add agents/core/synapse_manifest.py tests/test_h27_capability_manifests.py docs/nerva2/SYNAPSE_E8_0.md .github/workflows/nerva-e8-builder-fix.yml
          git commit -m "fix(nerva): harden E8 identity and signing evidence [e8-fix-applied]"
          git push origin HEAD:nerva2/e8-0-synapse-conformance

name: ANDREI OS vault containment (Windows native)

# apps/jarvis-os/vault_fs.py has a Windows implementation of its own (NtCreateFile with a
# RootDirectory handle). It only proves anything when it runs on real NTFS: junctions,
# symlinks, hard links, an ancestor swapped under a held handle, and exclusive creation
# relative to the inbox handle. A skipped case is not a pass, so this job fails on any.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/jarvis-os/**"
      - "agents/core/routers/jarvis_os.py"
      - "tests/test_jarvis_os_*.py"
      - ".github/workflows/jarvis-os-windows-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-os-windows-native-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vault-containment:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-beta.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --require-hashes -r requirements-beta.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Ruff
        run: >-
          ruff check apps/jarvis-os agents/core/routers/jarvis_os.py
          tests/test_jarvis_os_vault_fs.py tests/test_jarvis_os_router.py tests/test_jarvis_os_templates.py
      - name: Native NTFS containment, hub routes and page templates
        run: >-
          python -m pytest tests/test_jarvis_os_vault_fs.py tests/test_jarvis_os_router.py
          tests/test_jarvis_os_templates.py -v --tb=short
          --junitxml=jarvis-os-native-junit.xml
        env:
          JARVIS_TESTING: "1"
      - name: Require actual Windows execution of every case
        shell: pwsh
        run: |
          @'
          import sys
          import xml.etree.ElementTree as ET
          assert sys.platform == 'win32', sys.platform
          root = ET.parse('jarvis-os-native-junit.xml').getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          assert suite is not None
          counts = {key: int(suite.get(key, '-1')) for key in ('tests', 'failures', 'errors', 'skipped')}
          print('ANDREI OS native Windows JUnit:', counts)
          assert counts['tests'] >= 87 and all(counts[key] == 0 for key in ('failures', 'errors', 'skipped'))
          '@ | python -

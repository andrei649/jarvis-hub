name: Nerva E3.0 bounded hardening

on:
  pull_request:
    types:
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply bounded fail-closed corrections
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one match in {path}, found {count}"
                  )
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "agents/core/memory/_episode_values.py",
              '                raise ValueError("Episode ended_at cannot precede started_at")\n        if self.state == "open"',
              '                raise ValueError("Episode ended_at cannot precede started_at")\n            if self.ended_at > self.updated_at:\n                raise ValueError("Episode ended_at cannot follow updated_at")\n        if self.state == "open"',
          )

          replace_once(
              "agents/core/memory/_episode_operations.py",
              '                occurred_at=float(payload["occurred_at"]),\n',
              '                occurred_at=payload["occurred_at"],\n',
          )

          replace_once(
              "tests/_nerva_e3_0_checks.py",
              '        EpisodeAuditEvent.from_payload(tampered_audit_payload)\n\n    forged_episode_audit = _forge_audit(',
              '        EpisodeAuditEvent.from_payload(tampered_audit_payload)\n    boolean_timestamp_payload = json.loads(settled.audit.to_json())\n    boolean_timestamp_payload["occurred_at"] = True\n    with pytest.raises(ValueError, match="numeric"):\n        EpisodeAuditEvent.from_payload(boolean_timestamp_payload)\n\n    forged_episode_audit = _forge_audit(',
          )

          replace_once(
              "tests/_nerva_e3_0_checks.py",
              '            reason="time-reversing correction",\n        )\n\n    replayed = EpisodeRecord.from_json(settled_record.to_json())',
              '            reason="time-reversing correction",\n        )\n    with pytest.raises(ValueError, match="cannot follow updated_at"):\n        correct_episode(\n            settled_record,\n            actor_id="owner:andrei",\n            occurred_at=320,\n            reason="time-forward correction",\n            ended_at=321,\n        )\n    with pytest.raises(ValueError, match="cannot follow updated_at"):\n        replace(settled_record, updated_at=299)\n\n    replayed = EpisodeRecord.from_json(settled_record.to_json())',
          )

          replace_once(
              "docs/nerva2/M1_DELIVERY.md",
              '- Manual mutations emit tamper-evident audit events and exact immutable rollback\n  values. Merge and split remain atomic multi-record mutations.',
              '- Manual mutations emit deterministic integrity-checked audit events and exact\n  immutable rollback values. Plain SHA-256 detects changed or corrupted content but\n  does not authenticate a signer or provide non-repudiation. Merge and split remain\n  atomic multi-record mutations.',
          )

          replace_once(
              "tests/_nerva_e3_0_checks.py",
              '    assert "independent integration" in m1_doc\n    assert "#783 Synapse and #784 Research Lab remain separately eligible" in m1_doc',
              '    assert "independent integration" in m1_doc\n    assert "deterministic integrity-checked audit events" in m1_doc\n    assert "tamper-evident audit events" not in m1_doc\n    assert "#783 Synapse and #784 Research Lab remain separately eligible" in m1_doc',
          )

          Path(".github/workflows/nerva-e3-bounded-fix.yml").unlink()

      - name: Commit bounded corrections and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/core/memory/_episode_values.py \
                  agents/core/memory/_episode_operations.py \
                  tests/_nerva_e3_0_checks.py \
                  docs/nerva2/M1_DELIVERY.md \
                  .github/workflows/nerva-e3-bounded-fix.yml
          git diff --cached --check
          git commit -m "fix(nerva): close E3.0 fail-closed review gaps"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

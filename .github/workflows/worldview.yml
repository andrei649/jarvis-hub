name: WorldView CI

# Gates the self-contained worldview/ platform (separate stack from JARVIS). Path-filtered so
# it only runs when worldview/ changes and never affects the main JARVIS CI.
on:
  push:
    branches: [main]
    paths:
      - "worldview/**"
      - "docs/contracts/worldview-bridge.md"
      - ".github/workflows/worldview.yml"

permissions:
  contents: read

concurrency:
  group: worldview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingestion:
    name: Ingestion workers (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worldview/ingestion-workers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff pytest -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: python -m pytest

  node:
    name: API + Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worldview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worldview/package-lock.json
      - run: npm ci
      - name: Backend typecheck
        run: npm run typecheck --workspace backend-api
      - name: Backend tests
        run: npm test --workspace backend-api
      - name: Frontend typecheck
        run: npm run typecheck --workspace frontend
      - name: Frontend tests
        run: npm test --workspace frontend
      - name: Frontend build
        run: npm run build --workspace frontend

  mcp:
    name: MCP server (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worldview/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worldview/mcp/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test (incl. cross-language capability vectors)
        # capabilityVectors.test.ts pins the SAME shared fixture the JARVIS Python suite
        # (tests/test_worldview_mcp_capability.py) asserts, so the two security implementations
        # of the MCP capability-token format can never silently diverge.
        run: npm test

  integration:
    name: Integration (TimescaleDB + Redis)
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: worldview
          POSTGRES_USER: worldview
          POSTGRES_PASSWORD: worldview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worldview -d worldview"
          --health-interval 10s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://worldview:worldview@localhost:5432/worldview
      REDIS_URL: redis://localhost:6379
      PGPASSWORD: worldview
    defaults:
      run:
        working-directory: worldview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worldview/package-lock.json
      - run: npm ci
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema (real hypertables, continuous aggregates, policies, indexes)
        run: |
          for f in db/schema/*.sql; do
            echo "::group::$f"
            psql -h localhost -U worldview -d worldview -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done
      - name: Seed demo data
        run: psql -h localhost -U worldview -d worldview -v ON_ERROR_STOP=1 -f db/seed/demo.sql
      - name: Refresh continuous aggregates
        # The background continuous-aggregate policy job may already be refreshing, which makes
        # a manual refresh fail with "concurrent refresh". Retry until it succeeds so the cagg
        # is deterministically materialized before the integration test reads it.
        run: |
          set +e
          refresh() {
            for i in $(seq 1 20); do
              out=$(psql -h localhost -U worldview -d worldview \
                    -c "CALL refresh_continuous_aggregate('$1', NULL, NULL);" 2>&1)
              if [ $? -eq 0 ]; then echo "refreshed $1"; return 0; fi
              echo "$out"
              case "$out" in
                *"concurrent refresh"*) echo "retrying $1..."; sleep 3 ;;
                *) return 1 ;;
              esac
            done
            return 1
          }
          refresh adsb_positions_1m || exit 1
          refresh ais_positions_1m || exit 1
      - name: Seed live state (Redis)
        run: node scripts/seed-live.mjs
      - name: Integration tests (repositories vs real DB + Redis)
        run: npm run test:integration --workspace backend-api

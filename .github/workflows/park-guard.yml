name: Park-list guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  parked-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Select last merged park policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:scripts/park_guard.py"; then
            git show "$BASE_SHA:scripts/park_guard.py" > "$RUNNER_TEMP/park_guard.py"
          else
            cp scripts/park_guard.py "$RUNNER_TEMP/park_guard.py"
          fi
      - name: Enforce phased unpark policy
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python "$RUNNER_TEMP/park_guard.py"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"

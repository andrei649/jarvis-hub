# HUD E2E (H23.17) — boots the real backend + drives the served /v2 bundle in
# headless Chromium (Playwright). Proves the canvas Neural Mesh actually paints +
# the HUD mounts without an uncaught exception — the gap jsdom/vitest can't cover.
#
# Standalone workflow (not part of the required `CI` checks) so a heavier/slower
# browser+backend lane can stabilise before it gates merges. Screenshots + the
# Playwright report upload as artifacts for the human review pass.
name: HUD E2E

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "frontend/**"
      - "agents/web/v2/**"
      - "serve.py"
      - "agents/web.py"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-beta.lock
      - run: pip install --require-hashes -r requirements-beta.lock

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: E2E (boots serve.py, drives /v2)
        run: npm run e2e
        working-directory: frontend
        env:
          E2E_PYTHON: python   # CI installs deps into the system python, not a venv

      - name: Upload artifacts (screenshots + report)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hud-e2e-artifacts
          path: |
            frontend/e2e/artifacts/
            frontend/e2e/.results/
          if-no-files-found: ignore
          retention-days: 14

# HUD E2E (H23.17) — boots the real backend + drives the served /v2 bundle in
# headless Chromium (Playwright). Proves the canvas Neural Mesh actually paints +
# the HUD mounts without an uncaught exception — the gap jsdom/vitest can't cover.
#
# Standalone workflow (not part of the required `CI` checks) so a heavier/slower
# browser+backend lane can stabilise before it gates merges. Screenshots + the
# Playwright report upload as artifacts for the human review pass.
name: HUD E2E

on:
  schedule:
    # Nightly 03:15 UTC: browser matrix + repeated soak against /metrics.
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "frontend/**"
      - "agents/web/v2/**"
      - "serve.py"
      - "agents/web.py"
      # The webServer boots the REAL backend (serve.py + orchestrator), so a
      # core-pipeline regression that breaks boot or /metrics is this lane's to
      # catch — found as an oracle gap reviewing #498, which rewired the chat
      # turn pipeline without ever triggering it.
      - "agents/core/**"
      - "frontend/playwright.config.ts"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # PR/push stays lightweight (Chromium x1). Scheduled runs become the M2.2 soak:
      # Chromium + Firefox + WebKit + mobile emulation, with every spec repeated.
      E2E_BROWSER_MATRIX: ${{ github.event_name == 'schedule' && '1' || '0' }}
      E2E_SOAK_ITERATIONS: ${{ github.event_name == 'schedule' && '3' || '1' }}
      PLAYWRIGHT_BROWSERS: ${{ github.event_name == 'schedule' && 'chromium firefox webkit' || 'chromium' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-beta.lock
      - run: pip install --require-hashes -r requirements-beta.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps $PLAYWRIGHT_BROWSERS
        working-directory: frontend

      - name: Publish soak plan
        run: |
          {
            echo "## HUD E2E soak"
            echo "- Browser matrix: $E2E_BROWSER_MATRIX"
            echo "- Repeat count: $E2E_SOAK_ITERATIONS"
            echo "- Installed browsers: $PLAYWRIGHT_BROWSERS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: E2E (boots serve.py, drives /v2)
        run: npm run e2e
        working-directory: frontend
        env:
          E2E_PYTHON: python   # CI installs deps into the system python, not a venv

      - name: Upload artifacts (screenshots + report)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hud-e2e-artifacts
          path: |
            frontend/e2e/artifacts/
            frontend/e2e/.results/
          if-no-files-found: ignore
          retention-days: 14

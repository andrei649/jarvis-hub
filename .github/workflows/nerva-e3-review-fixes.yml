name: Nerva E3 bounded review corrections

on:
  push:
    branches:
      - nerva2/e3-0-episodes-manual-boundaries

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: nerva2/e3-0-episodes-manual-boundaries
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Apply bounded review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          values_path = Path('agents/core/memory/_episode_values.py')
          values = values_path.read_text(encoding='utf-8')

          replacements = [
              ("_ALLOWED_OPERATIONS = {'open', 'settle', 'consolidate', 'correct', 'merge', 'split', 'tombstone', 'migrate'}\n\n", ""),
              ("_KEEP = object()\n\n", ""),
              ("_SETTLEMENT_CONFIDENCE_FLOOR = 0.75\n\n", "_SETTLEMENT_CONFIDENCE_FLOOR = 0.75\n\n_MAX_ASSERTION_TEXT_CHARS = 4096\n\n"),
              (
                  "        if self.deleted_at is not None:\n            _validate_time(self.deleted_at, 'deleted_at')\n            if not self.tombstoned:\n",
                  "        if self.deleted_at is not None:\n            _validate_time(self.deleted_at, 'deleted_at')\n            if self.deleted_at < self.occurred_at:\n                raise ValueError('Episode deleted_at cannot precede source occurrence')\n            if not self.tombstoned:\n",
              ),
              (
                  "        _require_non_empty(self.text, 'assertion text')\n        if self.kind not in _ALLOWED_ASSERTION_KINDS:\n",
                  "        _require_non_empty(self.text, 'assertion text')\n        if len(self.text) > _MAX_ASSERTION_TEXT_CHARS:\n            raise ValueError('Episode assertion text exceeds 4096 characters')\n        if self.kind not in _ALLOWED_ASSERTION_KINDS:\n",
              ),
          ]
          for old, new in replacements:
              if old not in values:
                  raise SystemExit(f'missing values replacement: {old[:80]!r}')
              values = values.replace(old, new, 1)
          values_path.write_text(values, encoding='utf-8')

          operations_path = Path('agents/core/memory/_episode_operations.py')
          operations = operations_path.read_text(encoding='utf-8')
          replacements = [
              (
                  "from __future__ import annotations\n\nfrom collections.abc import Sequence\n",
                  "from __future__ import annotations\n\nimport json\nfrom collections.abc import Sequence\n",
              ),
              ("    _ALLOWED_OPERATIONS,\n    _ALLOWED_STATES,\n    _KEEP,\n", "    _ALLOWED_STATES,\n"),
              (
                  ")\n\n\n@dataclass(frozen=True)\nclass EpisodeAuditEvent:\n",
                  ")\n\n_ALLOWED_OPERATIONS = {'open', 'settle', 'consolidate', 'correct', 'merge', 'split', 'tombstone', 'migrate'}\n_KEEP = object()\n_MAX_AUDIT_REASON_CHARS = 1024\n\n\n@dataclass(frozen=True)\nclass EpisodeAuditEvent:\n",
              ),
              (
                  "        _require_non_empty(self.reason, 'audit reason')\n        if self.operation not in _ALLOWED_OPERATIONS:\n",
                  "        _require_non_empty(self.reason, 'audit reason')\n        if len(self.reason) > _MAX_AUDIT_REASON_CHARS:\n            raise ValueError('Episode audit reason exceeds 1024 characters')\n        if self.operation not in _ALLOWED_OPERATIONS:\n",
              ),
              (
                  "    def verify_integrity(self) -> bool:\n        return self.integrity_sha256 == _sha256({**self.audit_material(), 'audit_id': self.audit_id})\n\n@dataclass(frozen=True)\nclass EpisodeMutation:\n",
                  "    def verify_integrity(self) -> bool:\n        return self.integrity_sha256 == _sha256({**self.audit_material(), 'audit_id': self.audit_id})\n\n    def canonical_payload(self) -> dict[str, Any]:\n        return {\n            **self.audit_material(),\n            'audit_id': self.audit_id,\n            'integrity_sha256': self.integrity_sha256,\n        }\n\n    def to_json(self) -> str:\n        return json.dumps(self.canonical_payload(), sort_keys=True, separators=(',', ':'))\n\n    @classmethod\n    def from_json(cls, value: str) -> EpisodeAuditEvent:\n        if not isinstance(value, str):\n            raise ValueError('Episode audit JSON must be a string')\n        try:\n            payload = json.loads(value)\n        except json.JSONDecodeError as exc:\n            raise ValueError('Episode audit JSON is invalid') from exc\n        return cls.from_payload(payload)\n\n    @classmethod\n    def from_payload(cls, payload: dict[str, Any]) -> EpisodeAuditEvent:\n        if not isinstance(payload, dict):\n            raise ValueError('Episode audit payload must be an object')\n        if payload.get('schema') != 'nerva.episode.audit.v1':\n            raise ValueError('Episode audit schema is not recognized')\n        if payload.get('authority') != 'memory_record_only':\n            raise ValueError('Episode audit payload attempts to expand authority')\n        for flag in ('can_authorize', 'can_execute', 'can_mark_complete'):\n            if payload.get(flag) is not False:\n                raise ValueError('Episode audit payload attempts to expand authority')\n        try:\n            return cls(\n                audit_id=payload['audit_id'],\n                operation=payload['operation'],\n                actor_id=payload['actor_id'],\n                occurred_at=float(payload['occurred_at']),\n                reason=payload['reason'],\n                input_record_ids=tuple(payload['input_record_ids']),\n                output_record_ids=tuple(payload['output_record_ids']),\n                input_episode_ids=tuple(payload['input_episode_ids']),\n                output_episode_ids=tuple(payload['output_episode_ids']),\n                affected_reference_ids=tuple(payload['affected_reference_ids']),\n                integrity_sha256=payload['integrity_sha256'],\n            )\n        except (KeyError, TypeError, ValueError) as exc:\n            if isinstance(exc, ValueError):\n                raise\n            raise ValueError('Episode audit payload is malformed') from exc\n\n\n@dataclass(frozen=True)\nclass EpisodeMutation:\n",
              ),
              (
                  "        if tuple(record.record_id for record in self.after) != self.audit.output_record_ids:\n            raise ValueError('Episode mutation after records do not match audit')\n\n    def rollback(self) -> tuple[EpisodeRecord, ...]:\n",
                  "        if tuple(record.record_id for record in self.after) != self.audit.output_record_ids:\n            raise ValueError('Episode mutation after records do not match audit')\n        if tuple(record.episode_id for record in self.before) != self.audit.input_episode_ids:\n            raise ValueError('Episode mutation input episode IDs do not match audit')\n        if tuple(record.episode_id for record in self.after) != self.audit.output_episode_ids:\n            raise ValueError('Episode mutation output episode IDs do not match audit')\n        mutation_reference_ids = {\n            reference.reference_id\n            for record in (*self.before, *self.after)\n            for reference in record.references\n        }\n        unknown_affected = set(self.audit.affected_reference_ids) - mutation_reference_ids\n        if unknown_affected:\n            raise ValueError('Episode mutation audit names unrelated affected references')\n\n    def rollback(self) -> tuple[EpisodeRecord, ...]:\n",
              ),
              (
                  "def settle_episode(record: EpisodeRecord, *, ended_at: float, actor_id: str, occurred_at: float, reason: str, additional_references: tuple[EpisodeReference, ...]=(), summary: EpisodeAssertion | None=None, significance: EpisodeAssertion | None=None) -> EpisodeMutation:\n    _require_current_state(record, {'open'}, 'settle')\n    references = _merge_references(record.references, additional_references)\n",
                  "def settle_episode(record: EpisodeRecord, *, ended_at: float, actor_id: str, occurred_at: float, reason: str, additional_references: tuple[EpisodeReference, ...]=(), summary: EpisodeAssertion | None=None, significance: EpisodeAssertion | None=None) -> EpisodeMutation:\n    _require_current_state(record, {'open'}, 'settle')\n    _require_operation_time((record,), occurred_at, 'settle')\n    if ended_at > occurred_at:\n        raise ValueError('Episode settlement end cannot be in the future')\n    references = _merge_references(record.references, additional_references)\n",
              ),
              (
                  "def consolidate_episode(record: EpisodeRecord, *, actor_id: str, occurred_at: float, reason: str, summary: EpisodeAssertion | None=None, significance: EpisodeAssertion | None=None) -> EpisodeMutation:\n    _require_current_state(record, {'settled'}, 'consolidate')\n",
                  "def consolidate_episode(record: EpisodeRecord, *, actor_id: str, occurred_at: float, reason: str, summary: EpisodeAssertion | None=None, significance: EpisodeAssertion | None=None) -> EpisodeMutation:\n    _require_current_state(record, {'settled'}, 'consolidate')\n    _require_operation_time((record,), occurred_at, 'consolidate')\n",
              ),
              (
                  "def correct_episode(record: EpisodeRecord, *, actor_id: str, occurred_at: float, reason: str, participants: tuple[str, ...] | object=_KEEP, started_at: float | object=_KEEP, ended_at: float | None | object=_KEEP, references: tuple[EpisodeReference, ...] | object=_KEEP, goal: EpisodeAssertion | None | object=_KEEP, summary: EpisodeAssertion | None | object=_KEEP, significance: EpisodeAssertion | None | object=_KEEP) -> EpisodeMutation:\n    _require_current_state(record, {'open', 'settled', 'consolidated'}, 'correct')\n",
                  "def correct_episode(record: EpisodeRecord, *, actor_id: str, occurred_at: float, reason: str, participants: tuple[str, ...] | object=_KEEP, started_at: float | object=_KEEP, ended_at: float | None | object=_KEEP, references: tuple[EpisodeReference, ...] | object=_KEEP, goal: EpisodeAssertion | None | object=_KEEP, summary: EpisodeAssertion | None | object=_KEEP, significance: EpisodeAssertion | None | object=_KEEP) -> EpisodeMutation:\n    _require_current_state(record, {'open', 'settled', 'consolidated'}, 'correct')\n    _require_operation_time((record,), occurred_at, 'correct')\n",
              ),
              (
                  "    if len({record.episode_id for record in records}) != len(records):\n        raise ValueError('Episode merge requires distinct logical episodes')\n    references = _merge_references((), tuple(reference for record in records for reference in record.references))\n",
                  "    if len({record.episode_id for record in records}) != len(records):\n        raise ValueError('Episode merge requires distinct logical episodes')\n    _require_operation_time(records, occurred_at, 'merge')\n    references = _merge_references((), tuple(reference for record in records for reference in record.references))\n",
              ),
              (
                  "def split_episode(record: EpisodeRecord, partitions: tuple[EpisodePartition, ...], *, actor_id: str, occurred_at: float, reason: str) -> EpisodeMutation:\n    _require_current_state(record, {'open', 'settled', 'consolidated'}, 'split')\n",
                  "def split_episode(record: EpisodeRecord, partitions: tuple[EpisodePartition, ...], *, actor_id: str, occurred_at: float, reason: str) -> EpisodeMutation:\n    _require_current_state(record, {'open', 'settled', 'consolidated'}, 'split')\n    _require_operation_time((record,), occurred_at, 'split')\n",
              ),
              (
                  "def tombstone_sources(record: EpisodeRecord, *, deletion_root_ids: tuple[str, ...], deleted_at: float, actor_id: str, occurred_at: float, reason: str) -> EpisodeMutation:\n    _require_current_state(record, {'open', 'settled', 'consolidated'}, 'tombstone')\n    roots = _validated_string_tuple(deletion_root_ids, 'deletion_root_ids', allow_empty=False)\n",
                  "def tombstone_sources(record: EpisodeRecord, *, deletion_root_ids: tuple[str, ...], deleted_at: float, actor_id: str, occurred_at: float, reason: str) -> EpisodeMutation:\n    _require_current_state(record, {'open', 'settled', 'consolidated'}, 'tombstone')\n    _require_operation_time((record,), occurred_at, 'tombstone')\n    _validate_time(deleted_at, 'deleted_at')\n    if deleted_at > occurred_at:\n        raise ValueError('Episode deletion timestamp cannot be in the future')\n    roots = _validated_string_tuple(deletion_root_ids, 'deletion_root_ids', allow_empty=False)\n",
              ),
              (
                  "    if not affected:\n        raise ValueError('Episode tombstone did not match any source lineage')\n    affected_set = set(affected)\n",
                  "    if not affected:\n        raise ValueError('Episode tombstone did not match any source lineage')\n    affected_set = set(affected)\n    if any(\n        deleted_at < reference.occurred_at\n        for reference in record.references\n        if reference.reference_id in affected_set\n    ):\n        raise ValueError('Episode deletion timestamp precedes source occurrence')\n",
              ),
              (
                  "            outcome_ids = {ref.record_id for ref in record.outcome_references}\n",
                  "            outcome_ids = {\n                ref.record_id for ref in record.outcome_references if not ref.tombstoned\n            }\n",
              ),
              (
                  "            text = _normalize_text(' '.join(assertion.text for assertion in (record.goal, record.summary, record.significance) if assertion is not None))\n",
                  "            active_reference_ids = {\n                reference.reference_id\n                for reference in record.references\n                if not reference.tombstoned\n            }\n            text = _normalize_text(\n                ' '.join(\n                    assertion.text\n                    for assertion in (record.goal, record.summary, record.significance)\n                    if assertion is not None\n                    and set(assertion.evidence_reference_ids) <= active_reference_ids\n                )\n            )\n",
              ),
              (
                  "def _superseded_revision(record: EpisodeRecord, *, successor_episode_ids: tuple[str, ...], occurred_at: float) -> EpisodeRecord:\n",
                  "def _require_operation_time(records: tuple[EpisodeRecord, ...], occurred_at: float, operation: str) -> None:\n    _validate_time(occurred_at, f'{operation} occurred_at')\n    if any(occurred_at < record.updated_at for record in records):\n        raise ValueError(f'Episode {operation} cannot precede the current revision')\n\n\ndef _superseded_revision(record: EpisodeRecord, *, successor_episode_ids: tuple[str, ...], occurred_at: float) -> EpisodeRecord:\n",
              ),
          ]
          for old, new in replacements:
              if old not in operations:
                  raise SystemExit(f'missing operations replacement: {old[:100]!r}')
              operations = operations.replace(old, new, 1)
          operations_path.write_text(operations, encoding='utf-8')

          tests_path = Path('tests/_nerva_e3_0_checks.py')
          tests = tests_path.read_text(encoding='utf-8')
          replacements = [
              (
                  "from agents.core.memory.episodes import (\n    EpisodeAssertion,\n",
                  "from agents.core.memory.episodes import (\n    EpisodeAssertion,\n    EpisodeAuditEvent,\n    EpisodeMutation,\n",
              ),
              (
                  "from agents.core.memory.bitemporal import BiTemporalKG\n",
                  "from agents.core.memory.bitemporal import BiTemporalKG\nfrom agents.core.memory._episode_values import _sha256\n",
              ),
              (
                  "    assert settled.audit.verify_integrity()\n\n    replayed = EpisodeRecord.from_json(settled_record.to_json())\n",
                  "    assert settled.audit.verify_integrity()\n    replayed_audit = EpisodeAuditEvent.from_json(settled.audit.to_json())\n    assert replayed_audit == settled.audit\n    tampered_audit_payload = json.loads(settled.audit.to_json())\n    tampered_audit_payload['can_execute'] = True\n    with pytest.raises(ValueError, match='authority'):\n        EpisodeAuditEvent.from_payload(tampered_audit_payload)\n    tampered_audit_payload = json.loads(settled.audit.to_json())\n    tampered_audit_payload['reason'] = 'silently changed'\n    with pytest.raises(ValueError, match='canonical|integrity'):\n        EpisodeAuditEvent.from_payload(tampered_audit_payload)\n\n    forged_material = settled.audit.audit_material()\n    forged_material['input_episode_ids'] = ('episode:forged',)\n    forged_audit_id = 'episode:audit:' + _sha256(forged_material)[:24]\n    forged_audit = EpisodeAuditEvent(\n        audit_id=forged_audit_id,\n        operation=settled.audit.operation,\n        actor_id=settled.audit.actor_id,\n        occurred_at=settled.audit.occurred_at,\n        reason=settled.audit.reason,\n        input_record_ids=settled.audit.input_record_ids,\n        output_record_ids=settled.audit.output_record_ids,\n        input_episode_ids=('episode:forged',),\n        output_episode_ids=settled.audit.output_episode_ids,\n        affected_reference_ids=settled.audit.affected_reference_ids,\n        integrity_sha256=_sha256({**forged_material, 'audit_id': forged_audit_id}),\n    )\n    with pytest.raises(ValueError, match='input episode IDs'):\n        EpisodeMutation(before=settled.before, after=settled.after, audit=forged_audit)\n\n    unrelated_material = settled.audit.audit_material()\n    unrelated_material['affected_reference_ids'] = ('episode:ref:unrelated',)\n    unrelated_audit_id = 'episode:audit:' + _sha256(unrelated_material)[:24]\n    unrelated_audit = EpisodeAuditEvent(\n        audit_id=unrelated_audit_id,\n        operation=settled.audit.operation,\n        actor_id=settled.audit.actor_id,\n        occurred_at=settled.audit.occurred_at,\n        reason=settled.audit.reason,\n        input_record_ids=settled.audit.input_record_ids,\n        output_record_ids=settled.audit.output_record_ids,\n        input_episode_ids=settled.audit.input_episode_ids,\n        output_episode_ids=settled.audit.output_episode_ids,\n        affected_reference_ids=('episode:ref:unrelated',),\n        integrity_sha256=_sha256({**unrelated_material, 'audit_id': unrelated_audit_id}),\n    )\n    with pytest.raises(ValueError, match='unrelated affected references'):\n        EpisodeMutation(before=settled.before, after=settled.after, audit=unrelated_audit)\n\n    with pytest.raises(ValueError, match='4096'):\n        _direct('x' * 4097, first_ref.reference_id)\n    with pytest.raises(ValueError, match='1024'):\n        open_episode(\n            participants=('person:andrei',),\n            started_at=100,\n            references=(first_ref,),\n            actor_id='owner:andrei',\n            occurred_at=205,\n            reason='x' * 1025,\n        )\n    with pytest.raises(ValueError, match='precede the current revision'):\n        correct_episode(\n            settled_record,\n            actor_id='owner:andrei',\n            occurred_at=309,\n            reason='time reversal',\n        )\n\n    replayed = EpisodeRecord.from_json(settled_record.to_json())\n",
              ),
              (
                  "    assert merged_record == reordered_record\n    assert merged.audit == merged_reordered.audit\n",
                  "    assert merged_record == reordered_record\n    assert merged.audit == merged_reordered.audit\n    assert trace_source_derivatives(\n        merged_record, first_ref.deletion_root_id\n    ).reference_ids == (first_ref.reference_id,)\n",
              ),
              (
                  "    assert child_references == {\n        reference.reference_id for reference in merged_record.references\n    }\n    assert split.rollback() == (merged_record,)\n",
                  "    assert child_references == {\n        reference.reference_id for reference in merged_record.references\n    }\n    first_child = next(\n        child\n        for child in split.after\n        if child.state != 'superseded'\n        and first_ref.reference_id in {ref.reference_id for ref in child.references}\n    )\n    assert trace_source_derivatives(\n        first_child, first_ref.deletion_root_id\n    ).reference_ids == (first_ref.reference_id,)\n    assert split.rollback() == (merged_record,)\n",
              ),
              (
                  "    tombstoned = tombstone_sources(\n        settled_record,\n",
                  "    with pytest.raises(ValueError, match='precedes source occurrence'):\n        tombstone_sources(\n            settled_record,\n            deletion_root_ids=(first_ref.deletion_root_id,),\n            deleted_at=99,\n            actor_id='owner:andrei',\n            occurred_at=800,\n            reason='invalid source deletion time',\n        )\n    with pytest.raises(ValueError, match='future'):\n        tombstone_sources(\n            settled_record,\n            deletion_root_ids=(first_ref.deletion_root_id,),\n            deleted_at=801,\n            actor_id='owner:andrei',\n            occurred_at=800,\n            reason='future source deletion time',\n        )\n\n    tombstoned = tombstone_sources(\n        settled_record,\n",
              ),
              (
                  "    assert tombstoned.rollback() == (settled_record,)\n\n    legacy = {\n",
                  "    assert tombstoned.rollback() == (settled_record,)\n\n    outcome_tombstoned = tombstone_sources(\n        settled_record,\n        deletion_root_ids=(outcome.deletion_root_id,),\n        deleted_at=800,\n        actor_id='owner:andrei',\n        occurred_at=800,\n        reason='verified outcome deleted',\n    ).after[0]\n    assert retrieve_episodes(\n        (outcome_tombstoned,),\n        EpisodeQuery(outcome_record_ids=('outcome:travel-plan-confirmed',)),\n    ) == ()\n\n    legacy = {\n",
              ),
          ]
          for old, new in replacements:
              if old not in tests:
                  raise SystemExit(f'missing tests replacement: {old[:100]!r}')
              tests = tests.replace(old, new, 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install --require-hashes -r requirements-beta.lock
          pip install --require-hashes -r requirements-dev.lock

      - name: Verify bounded correction
        shell: bash
        run: |
          set -euo pipefail
          ruff check --fix \
            agents/core/memory/_episode_operations.py \
            agents/core/memory/_episode_values.py \
            tests/_nerva_e3_0_checks.py
          ruff check \
            agents/core/memory/_episode_operations.py \
            agents/core/memory/_episode_values.py \
            agents/core/memory/episodes.py \
            tests/_nerva_e3_0_checks.py \
            tests/test_h14_1_bitemporal_kg.py
          pytest -q tests/test_h14_1_bitemporal_kg.py

      - name: Commit bounded correction and remove maintenance workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/nerva-e3-review-fixes.yml
          git add -A
          git commit -m "fix(nerva): harden E3 audit privacy and chronology"
          git push origin HEAD:nerva2/e3-0-episodes-manual-boundaries
